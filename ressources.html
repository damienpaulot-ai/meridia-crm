(function(){
const SB_URL="https://ccsuzunjyzqzsahaolre.supabase.co",SB_KEY="sb_publishable_V-MT9fZgY01dOoChApzz3w_uNV87Nmd";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
window.SB=sb;window.WEB=true;document.documentElement.classList.add("web");
let session=null,ready,resolveReady;ready=new Promise(r=>resolveReady=r);
const ROLE={owner:false,member:false,key:null};window.WEBROLE=ROLE;
// ---- adaptateur db (même API que celle du logiciel) ----
const colL={},docL={};let chan=null;
const parent=p=>p.replace(/\/[^/]+$/,"");
const mkDoc=(path,data)=>({id:path.split("/").pop(),exists:data!=null,data:()=>data});
async function fetchCol(c){const {data,error}=await sb.from("docs").select("path,data").eq("col",c);if(error)throw error;return {docs:data.map(r=>mkDoc(r.path,r.data)),metadata:{fromCache:false}}}
async function fetchDoc(p){const {data,error}=await sb.from("docs").select("data").eq("path",p).maybeSingle();if(error)throw error;return mkDoc(p,data?data.data:null)}
const pend={};
function refresh(kind,key){const id=kind+key;if(pend[id])return;pend[id]=setTimeout(async()=>{delete pend[id];
  const L=(kind==="c"?colL:docL)[key];if(!L||!L.size)return;
  try{const s=kind==="c"?await fetchCol(key):await fetchDoc(key);L.forEach(o=>o.cb(s))}catch(e){L.forEach(o=>o.err&&o.err(e))}},120)}
function touched(p){refresh("c",parent(p));refresh("d",p)}
function ensureChan(){if(chan)return;chan=sb.channel("docs-all").on("postgres_changes",{event:"*",schema:"public",table:"docs"},pl=>{const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path);if(p)touched(p)}).subscribe()}
function listen(map,kind,key,cb,err){const o={cb,err};(map[key]=map[key]||new Set()).add(o);ensureChan();
  (kind==="c"?fetchCol(key):fetchDoc(key)).then(cb,e=>err&&err(e));return()=>map[key].delete(o)}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
async function setDoc(p,d){const {error}=await sb.from("docs").upsert({path:p,col:parent(p),data:JSON.parse(JSON.stringify(d))});if(error)throw error;touched(p)}
async function updDoc(p,patch){const {data,error}=await sb.from("docs").select("data").eq("path",p).maybeSingle();if(error)throw error;if(!data)throw new Error("Document introuvable");
  const nd={...data.data};Object.entries(patch).forEach(([k,v])=>{if(v===undefined)delete nd[k];else nd[k]=v});
  const r=await sb.from("docs").update({data:JSON.parse(JSON.stringify(nd))}).eq("path",p);if(r.error)throw r.error;touched(p)}
async function delDoc(p){const {error}=await sb.from("docs").delete().eq("path",p);if(error)throw error;touched(p)}
const db={
  collection:c=>({onSnapshot:(cb,err)=>listen(colL,"c",c,cb,err),add:async d=>{const id=rid();await setDoc(c+"/"+id,d);return {id}},doc:id=>db.doc(c+"/"+id)}),
  doc:p=>({onSnapshot:(cb,err)=>listen(docL,"d",p,cb,err),set:d=>setDoc(p,d),update:d=>updDoc(p,d),delete:()=>delDoc(p),get:()=>fetchDoc(p)})
};
const user={isOwner:async()=>ROLE.owner,canEdit:async()=>ROLE.member,can:async()=>ROLE.member,id:async()=>session?.user?.id||null,
  me:async()=>({id:session?.user?.id,name:"",email:session?.user?.email}),profiles:async()=>({})};
const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename||"export";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
window.claude={use:async n=>{await ready;if(!ROLE.member)return null;return n==="db"?db:n==="user"?user:n==="downloads"?downloads:null}};
// ---- écran de connexion ----
const $$=id=>document.getElementById(id);
let tab="in",msgTxt="",busy=false;
function logo(){return document.querySelector(".logo img.logo-l")?.getAttribute("src")||""}
function paint(){const el=$$("login");if(!el)return;
  const f=(id,l,t,ac)=>`<div class="field"><label for="${id}">${l}</label>${t==="password"?`<div class="l-pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="l-eye" data-eye="${id}" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>`:`<input id="${id}" type="${t}" autocomplete="${ac}" ${t==="email"?'inputmode="email"':""}>`}</div>`;
  let body="";
  if(tab==="denied")body=`<p class="p-sub">Tu es connecté(e) avec <b>${(session?.user?.email||"").replace(/</g,"&lt;")}</b>, mais cette adresse n'a pas accès au logiciel.</p><div class="p-box">Demande à ton manager de t'inviter avec cette adresse, ou connecte-toi avec une autre.</div><button class="btn ghost p-go" type="button" data-out>Changer de compte</button>`;
  else if(tab==="forgot")body=`<p class="p-sub">Pour des raisons de sécurité, le mot de passe est réinitialisé par un administrateur.</p><div class="p-box">Demande à Damien ou à Hugo de te donner un nouveau mot de passe depuis l'écran Accès & équipes. Tu pourras ensuite le changer.</div><button class="btn ghost p-go" type="button" data-tab="in">Retour à la connexion</button>`;
  else body=`<div class="seg l-tabs" role="tablist"><button type="button" data-tab="in" aria-pressed="${tab==="in"}">Se connecter</button><button type="button" data-tab="up" aria-pressed="${tab==="up"}">Créer mon compte</button></div>
    <form id="lForm" novalidate>${f("lMail","Adresse e-mail","email","email")}${f("lPass",tab==="up"?"Choisis un mot de passe (8 caractères minimum)":"Mot de passe","password",tab==="up"?"new-password":"current-password")}${tab==="up"?f("lPass2","Confirme le mot de passe","password","new-password"):""}
    <p class="err" id="lErr">${msgTxt}</p><button class="btn p-go" id="lGo" type="submit" ${busy?"disabled":""}>${tab==="up"?"Créer mon compte":"Se connecter"}</button></form>
    ${tab==="in"?`<button class="link l-forgot" type="button" data-tab="forgot">Mot de passe oublié ?</button>`:`<p class="p-hint" style="margin-top:12px">Seules les adresses invitées par un manager peuvent créer un compte.</p>`}`;
  const h1=tab==="up"?"Créer mon compte":tab==="denied"?"Accès non autorisé":tab==="forgot"?"Mot de passe oublié":"Bon retour !";
  const sub=tab==="up"?"Utilise l'adresse e-mail à laquelle tu as été invité(e).":tab==="in"?"Connecte-toi à ton espace Meridia.":"";
  el.innerHTML=`<div class="l-wrap"><aside class="l-art" aria-hidden="true"><div class="l-shade"></div>${logo()?`<img class="l-logo" src="${logo()}" alt="">`:""}<div class="l-copy"><h2>Ton activité et ton équipe,<br>au même endroit.</h2><p>Prospection, unités, structure et simulateurs pour les conseillers Meridia.</p></div><a class="l-cred" href="https://unsplash.com" target="_blank" rel="noopener">Photo · Unsplash</a></aside>
  <main class="l-side"><div class="l-form">${logo()?`<img class="p-logo l-mlogo" src="${logo()}" alt="Meridia">`:""}<h1>${h1}</h1>${sub?`<p class="p-sub">${sub}</p>`:""}${body}</div><p class="l-foot">Meridia · espace réservé aux conseillers invités</p></main></div>`}
function showLogin(t){tab=t||"in";msgTxt="";const el=$$("login");el.hidden=false;document.body.classList.add("portal-on");paint();setTimeout(()=>$$("lMail")?.focus(),50)}
function hideLogin(){$$("login").hidden=true;document.body.classList.remove("portal-on")}
document.addEventListener("click",async e=>{const ey=e.target.closest("#login [data-eye]");if(ey){const i=$$(ey.dataset.eye);i.type=i.type==="password"?"text":"password";ey.classList.toggle("on",i.type==="text");return}const t=e.target.closest("#login [data-tab]");if(t){tab=t.dataset.tab;msgTxt="";paint();return}
  if(e.target.closest("#login [data-out]")||e.target.closest("[data-logout]")){await sb.auth.signOut();location.reload()}});
document.addEventListener("submit",async e=>{if(e.target.id!=="lForm")return;e.preventDefault();if(busy)return;
  const email=$$("lMail").value.trim().toLowerCase(),pw=$$("lPass").value,err=m=>{msgTxt=m;busy=false;paint();$$("lMail").value=email};
  if(!email||!pw)return err("Indique ton e-mail et ton mot de passe.");
  busy=true;$$("lGo").disabled=true;
  if(tab==="up"){if(pw!==$$("lPass2").value)return err("Les deux mots de passe ne sont pas identiques.");
    try{const r=await fetch(SB_URL+"/functions/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({email,password:pw})});const j=await r.json().catch(()=>({}));if(!r.ok)return err(j.error||"Création impossible pour le moment.")}catch(x){return err("Connexion au serveur impossible. Vérifie ta connexion.")}}
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)return err(/invalid/i.test(error.message)?"E-mail ou mot de passe incorrect.":"Connexion impossible pour le moment.");
  busy=false;location.reload()});
async function boot(){const {data}=await sb.auth.getSession();session=data.session;
  if(!session){showLogin("in");return}
  const [o,m,k]=await Promise.all([sb.rpc("is_owner"),sb.rpc("is_member"),sb.rpc("my_key")]);
  ROLE.owner=o.data===true;ROLE.member=m.data===true;ROLE.key=k.data||null;window.WEBKEY=ROLE.key;
  if(!ROLE.member){showLogin("denied");return}
  if(ROLE.key&&!ROLE.owner){try{const {data:l}=await sb.from("docs").select("data").eq("path","liens/"+session.user.id).maybeSingle();if(!l||l.data?.key!==ROLE.key)await setDoc("liens/"+session.user.id,{key:ROLE.key})}catch(x){}}
  hideLogin();resolveReady();
  const side=document.querySelector(".side");if(side&&!document.querySelector("[data-logout]")){const b=document.createElement("button");b.type="button";b.className="logout";b.dataset.logout="1";b.textContent="Se déconnecter";side.appendChild(b)}}
sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"){session=null}});
document.addEventListener("DOMContentLoaded",boot);
})();


(function(){const u0=window.claude.use;window.claude.use=async n=>{if(n==="assets")return null;const r=await u0(n);if(n==="user"&&r)return {...r,canEdit:async()=>{if(window.WEBROLE&&window.WEBROLE.owner)return true;try{const {data}=await window.SB.rpc("is_super");return !!data}catch(e){return false}}};return r}})();
</script>

.pinned{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.empty{padding:56px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.foot{color:var(--muted);font-size:13px;margin-top:10px}

/* lecteur / éditeur */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:30;display:flex;justify-content:flex-end}
.sheet{background:var(--panel);width:min(640px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-24px 0 48px -24px rgba(0,0,0,.35)}
.sh-top{position:sticky;top:0;background:var(--panel);z-index:1;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sh-top .k{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--muted);flex:none}
.sh-body{padding:22px 24px 28px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;flex:1}
.sh-body h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.25}
.sh-body .lead{color:var(--muted);margin:-8px 0 0}
.sh-foot{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sh-foot .l{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.doc{font-size:15px;line-height:1.65;color:var(--ink-2)}
.doc>*{margin:0 0 12px}
.doc h4{font-size:13px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;margin-top:22px}
.doc h4:first-child{margin-top:0}
.doc ul{padding-left:20px}
.doc li{margin-bottom:4px}
.doc strong{color:var(--ink)}
.say{border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:0 8px 8px 0;color:var(--ink)}
.him{margin-left:18px!important;padding:4px 12px;border-left:2px dashed var(--line);color:var(--muted);font-style:italic}
.him b{font-style:normal}
.cue{color:var(--warn);font-weight:700;font-size:13px}
.cue::before{content:"→ "}
.media{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.media img,.media video{display:block;width:100%;height:auto}
.media iframe{display:block;width:100%;height:70vh;border:0}
.filebox{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.filebox .n{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebox .n small{display:block;font-weight:500;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;font-weight:700;color:var(--ink-2)}
.field small{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);height:36px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:0 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.check{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.help{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;line-height:1.6}
.help code{font-family:inherit;font-weight:800;color:var(--ink)}
.err{color:var(--bad);font-size:13px;margin:0}
.ask{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 14px;z-index:40;font-weight:600;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.scrim:not([hidden]) .sheet{animation:slide .18s ease-out}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}

/* calculateur */
.w{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.w-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.w-h h3{font-size:13px;font-weight:700;margin:0}
.w-h .sub{font-size:12px;color:var(--muted)}
.w-b{padding:14px 16px 16px}
.link{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:700;cursor:pointer;padding:2px}
.none{color:var(--muted);font-size:13px;padding:6px 0}
.cprods{display:flex;gap:14px 28px;flex-wrap:wrap;margin-bottom:16px}
.cgrp{display:flex;flex-direction:column;gap:7px;min-width:0}
.cgrp>span{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips .chip{height:34px;font-size:13px;padding:0 12px}
.cbody{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:16px;align-items:start}
.cres{position:sticky;top:78px}
.chead{align-items:flex-start}
.chead .sub{display:block;margin-top:2px}
.cmini{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:4px 10px;white-space:nowrap}
.csec{padding-bottom:16px}
.csec+.csec{border-top:1px solid var(--line-2);padding-top:14px}
.csec:last-child{padding-bottom:0}
.csec h4{margin:0 0 10px;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cf{display:flex;flex-direction:column;gap:6px;min-width:0}
.cf-w{grid-column:1/-1}
.cl{font-size:12px;font-weight:700;color:var(--ink-2)}
.cin{position:relative;display:block}
.cin input{padding-right:42px;height:38px;font-variant-numeric:tabular-nums;font-weight:600}
.cin em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;font-weight:700;color:var(--faint);pointer-events:none}
.cf small{font-size:11px;color:var(--muted)}
.ctot{display:flex;align-items:baseline;gap:8px}
.ctot .v{font-size:42px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ctot span:last-child{color:var(--muted);font-weight:700}
.clines{display:flex;flex-direction:column;border-top:1px solid var(--line-2);margin-top:14px}
.cl2{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.cl2 b{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.cwarns{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cwarn{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;border-radius:8px;padding:8px 10px}
.cnotes{margin:12px 0 0;padding-left:16px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.cdisc{font-size:11px;color:var(--faint);margin-top:12px}

@media (max-width:1000px){.cbody{grid-template-columns:minmax(0,1fr)}.cres{position:static}}
@media (max-width:700px){
  .top-in{flex-wrap:wrap;gap:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .addTop{margin-left:auto}
  .tabs{order:3;width:100%;margin-left:0}.tabs button{flex:1}
  .wrap{padding:18px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
  .hero h2{font-size:21px}.prog{width:100%}
  .two{grid-template-columns:minmax(0,1fr)}
  .sh-body{padding:18px 16px 24px}
}
</style>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dmy=d=>d?new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"";
const CATS=["Démarrer","Repères","Process de vente","Objections","Assurance vie","Retraite et PER","Prévoyance","Livrets et épargne","Investir","Fiscalité","Produits","Prospection","Outils"];
const TYPES=[["fiche","Fiche"],["lien","Lien"],["fichier","Fichier"]];
const ICO={fiche:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  lien:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  fichier:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg>`;
let db=null,assets=null,editor=false,R=[],cat="",ctx=null,loaded=false;
let READ={};try{READ=JSON.parse(localStorage.getItem("mer-res-lu")||"{}")||{}}catch(e){}
const saveRead=()=>{try{localStorage.setItem("mer-res-lu",JSON.stringify(READ))}catch(e){}};
let tt=null;function toast(t){$("toast").textContent=t;$("toast").hidden=false;clearTimeout(tt);tt=setTimeout(()=>$("toast").hidden=true,2600)}

/* mise en forme des fiches : # titre · - liste · > phrase à dire · < réponse du client · ! indication · **gras** */
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
function md(t){const out=[];let ul=null;
  String(t||"").split(/\r?\n/).forEach(raw=>{const l=raw.trim();
    if(l.startsWith("- ")){if(!ul){ul=[];out.push(ul)}ul.push(`<li>${inl(l.slice(2))}</li>`);return}
    ul=null;if(!l)return;
    if(l.startsWith("# "))out.push(`<h4>${inl(l.slice(2))}</h4>`);
    else if(l.startsWith("> "))out.push(`<p class="say">${inl(l.slice(2))}</p>`);
    else if(l.startsWith("< "))out.push(`<p class="him"><b>Lui :</b> ${inl(l.slice(2))}</p>`);
    else if(l.startsWith("! "))out.push(`<p class="cue">${inl(l.slice(2))}</p>`);
    else out.push(`<p>${inl(l)}</p>`)});
  return out.map(x=>Array.isArray(x)?`<ul>${x.join("")}</ul>`:x).join("")}

const catsAll=()=>[...new Set([...CATS,...R.map(r=>r.cat).filter(Boolean)])];
const sortR=(a,b)=>(catsAll().indexOf(a.cat)-catsAll().indexOf(b.cat))||((a.ordre??999)-(b.ordre??999))||String(a.titre).localeCompare(String(b.titre),"fr");
const safeUrl=u=>/^https?:\/\//i.test(String(u||"").trim())?String(u).trim():"";
const fileUrl=r=>r.fichier?.id?"/_blob/"+r.fichier.id:"";

function card(r){return `<div class="card${r.epingle?" pinned":""}" role="button" tabindex="0" data-id="${esc(r.id)}">

async function save(btn){const r=ctx.r,t=ctx.type,err=m=>{$("eErr").textContent=m};
  const titre=$("eT").value.trim();if(!titre){err("Donne un titre à la ressource.");$("eT").focus();return}

    if(f){if(!assets){err("L'envoi de fichiers n'est pas disponible ici.");return}if(f.size>20*1024*1024){err("Ce fichier dépasse 20 Mo.");return}

      catch(e){btn.disabled=false;btn.textContent="Enregistrer";err(e?.code==="unsupported_type"?"Ce type de fichier n'est pas accepté : envoie un PDF, une image ou une vidéo.":e?.code==="too_large"?"Ce fichier est trop lourd.":"L'envoi n'a pas abouti. Réessaie.");return}

        {t:"Versements programmés",f:[F("p","Prime annualisée","€",null,"Mensualité × 12"),UC("puc",100),F("pf","Frais d'entrée","%",5,"Maximum 5 %")]},
        {t:"Prime unique / transfert",f:[F("t","Montant","€"),UC("tuc",100),F("tf","Frais d'entrée","%",5,"Maximum 5 %")]}],
   run(v,o){const k=v.age>57?Math.max(0,1-0.2*(v.age-57)):1,o2={line:(l,u)=>o.line(l,u*k)};
     o2.line("PU · UC × 8,5 %",v.a*0.085/10);o2.line("PU · UC cat. 1 × 11,5 %",v.b*0.115/10);o.line("PU · frais d'entrée",(v.a+v.b)*pc(v.f)/10);
     if(v.p){surcoAV(o2,v.p,v.puc,50,"10 %","100 %","75 %","PP");o.line("PP · frais d'entrée × 5 ans × 81 %",v.p*pc(v.pf)*5/10*0.81)}
     if(v.t){surcoAV(o2,v.t,v.tuc,40,"1 %","11 %","8 %","Transfert");o.line("Transfert · frais d'entrée",v.t*pc(v.tf)/10)}
     if(k<1)o.warn(k>0?`Assuré de ${v.age} ans : surco réduite de ${Math.round((1-k)*100)} % (20 % par année après 57 ans).`:"Assuré de 62 ans ou plus : plus de surco, se renseigner à la centrale.");
     if((v.p&&v.pf>5)||(v.t&&v.tf>5))o.warn("Frais d'entrée au-dessus de 5 %.");
     o.note("PP : reprise sur 3 ans (100 / 90 / 80). Transfert : reprise sur 4 ans (100 / 90 / 80 / 70). Frais PP : reprise au prorata sur 5 ans.")}},
];
const GROUPS=[...new Set(CALC.map(p=>p.g))];
const prodLabel=p=>`${p.g} · ${p.l}`;
let CST={prod:"rep",v:{}},CTARGET="";
try{const s=JSON.parse(localStorage.getItem("mer-calc")||"null");if(s&&s.v)CST=s}catch(e){}
const calcSave=()=>{try{localStorage.setItem("mer-calc",JSON.stringify(CST))}catch(e){}};
const calcCur=()=>CALC.find(x=>x.k===CST.prod)||CALC[0];
function calcVals(p){if(!CST.v[p.k]){const d={};p.sec.forEach(s=>s.f.forEach(f=>{if(f.def!=null)d[f.k]=f.u==="tg"?f.def:String(f.def).replace(".",",")}));CST.v[p.k]=d}return CST.v[p.k]}
function calcRun(p){const raw=calcVals(p),v={};
  p.sec.forEach(s=>s.f.forEach(f=>{v[f.k]=f.u==="tg"?Number(raw[f.k]??f.def):num(raw[f.k]);if(f.split)v[f.k]=Math.min(100,Math.max(0,v[f.k]))}));
  const o={lines:[],warns:[],notes:[],line(l,u){if(Math.abs(u)>=0.005)this.lines.push([l,u])},warn(t){this.warns.push(t)},note(t){this.notes.push(t)}};
  p.run(v,o);o.total=o.lines.reduce((t,[,u])=>t+u,0);return o}
const euHint=val=>`Fonds euros : ${fmt1(100-Math.min(100,Math.max(0,num(val))))} %`;
function calcField(f,vals){const val=vals[f.k]??"";
  if(f.u==="tg")return `<div class="cf cf-w"><span class="cl">${f.l}</span><div class="seg" role="group" aria-label="${esc(f.l)}">${f.opts.map(([x,l])=>`<button type="button" data-tg="${f.k}" data-x="${x}" aria-pressed="${Number(val)===x}">${l}</button>`).join("")}</div></div>`;
  return `<label class="cf"><span class="cl">${f.l}</span><span class="cin"><input data-f="${f.k}" inputmode="decimal" autocomplete="off" enterkeyhint="done" value="${esc(val)}" placeholder="0"><em>${f.u}</em></span>${f.split||f.hint?`<small data-h="${f.k}">${f.split?euHint(val):f.hint}</small>`:""}</label>`}

function mountCalc(el){
  const paintRes=()=>{const p=calcCur(),r=calcRun(p),box=el.querySelector("[data-res]");
    box.innerHTML=`<div class="w-h"><h3>Résultat</h3><button class="link" type="button" data-creset>Réinitialiser</button></div><div class="w-b">
      <div class="ctot"><span class="v">${fmt1(r.total)}</span><span>unités</span></div>
      ${r.lines.length?`<div class="clines">${r.lines.map(([l,u])=>`<div class="cl2"><span>${esc(l)}</span><b>${fmt1(u)}</b></div>`).join("")}</div>`:`<div class="none" style="margin-top:12px">Renseigne les montants pour voir le détail.</div>`}
      ${r.warns.length?`<div class="cwarns">${r.warns.map(w=>`<div class="cwarn">${esc(w)}</div>`).join("")}</div>`:""}
      ${r.notes.length?`<ul class="cnotes">${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
      <div class="cdisc">Estimation d'après le fichier de calcul Meridia (version du 06/02/2024). En cas de doute, la centrale fait foi.</div></div>`;
    el.querySelector("[data-mini]").textContent=fmt1(r.total)+" u"};
  const paint=()=>{const p=calcCur(),vals=calcVals(p);
    el.innerHTML=`<div class="cprods">${GROUPS.map(g=>`<div class="cgrp"><span>${g}</span><div class="pchips">${CALC.filter(x=>x.g===g).map(x=>`<button type="button" class="chip" data-cp="${x.k}" aria-pressed="${x.k===p.k}">${esc(x.l)}</button>`).join("")}</div></div>`).join("")}</div>
    <div class="cbody"><div class="w"><div class="w-h chead"><div><h3>${esc(prodLabel(p))}</h3><span class="sub">${esc(p.d)}</span></div><b class="cmini" data-mini></b></div><div class="w-b">${p.sec.map(s=>`<div class="csec"><h4>${esc(s.t)}</h4><div class="cgrid">${s.f.map(f=>calcField(f,vals)).join("")}</div></div>`).join("")}</div></div><div class="w cres" data-res></div></div>`;
    paintRes()};
  el.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;calcVals(calcCur())[f]=e.target.value;calcSave();
    const h=el.querySelector(`[data-h="${f}"]`),fd=calcCur().sec.flatMap(s=>s.f).find(x=>x.k===f);if(h&&fd?.split)h.textContent=euHint(e.target.value);paintRes()});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.f){e.preventDefault();e.target.blur()}});
  el.addEventListener("click",e=>{const cp=e.target.closest("[data-cp]");if(cp){CST.prod=cp.dataset.cp;calcSave();paint();return}
    const tg=e.target.closest("[data-tg]");if(tg){calcVals(calcCur())[tg.dataset.tg]=Number(tg.dataset.x);calcSave();tg.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===tg));paintRes();return}
    if(e.target.closest("[data-creset]")){delete CST.v[CST.prod];calcSave();paint()}});
  paint();return {paint}}

render();
try{const t=localStorage.getItem("mer-res-tab");if(t==="calc")setTab("calc")}catch(e){}
(async()=>{
  const timer=setTimeout(()=>{if(!loaded)$("foot").textContent="Les ressources mettent du temps à arriver… vérifie ta connexion."},10000);
  db=window.claude?await window.claude.use("db"):null;
  if(!db){clearTimeout(timer);loaded=true;$("foot").textContent="Connecte-toi à Meridia Gestion pour voir les ressources.";render();return}
  try{const u=await window.claude.use("user");editor=u?await u.canEdit():false}catch(e){editor=false}
  if(editor){$("addBtn").hidden=false;try{assets=await window.claude.use("assets")}catch(e){assets=null}}
  db.collection("ressources").onSnapshot(s=>{clearTimeout(timer);$("foot").textContent="";loaded=true;R=s.docs.map(d=>({id:d.id,...d.data()}));render();
      if(ctx?.mode==="read"){const n=R.find(x=>x.id===ctx.r.id);if(!n)closeSheet()}},
    ()=>{clearTimeout(timer);loaded=true;$("foot").textContent="Impossible de charger les ressources.";render()});
})();
</script>
