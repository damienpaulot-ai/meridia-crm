<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="96x96" href="favicon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="supabase.js"></script>
<script>
// ---------- Meridia web : connexion Supabase + adaptateur de données ----------
(function(){
const SB_URL="https://ccsuzunjyzqzsahaolre.supabase.co",SB_KEY="sb_publishable_V-MT9fZgY01dOoChApzz3w_uNV87Nmd";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
window.SB=sb;window.WEB=true;document.documentElement.classList.add("web");
let session=null,ready,resolveReady;ready=new Promise(r=>resolveReady=r);
const ROLE={owner:false,member:false,key:null};window.WEBROLE=ROLE;
// ---- adaptateur db (même API que celle du logiciel) ----
const colL={},docL={};let chan=null;
const parent=p=>p.replace(/\/[^/]+$/,"");
const mkDoc=(path,data)=>({id:path.split("/").pop(),exists:data!=null,data:()=>data});
async function fetchCol(c){const {data,error}=await sb.from("docs").select("path,data").eq("col",c);if(error)throw error;return {docs:data.map(r=>mkDoc(r.path,r.data)),metadata:{fromCache:false}}}
async function fetchDoc(p){const {data,error}=await sb.from("docs").select("data").eq("path",p).maybeSingle();if(error)throw error;return mkDoc(p,data?data.data:null)}
const pend={};
function refresh(kind,key){const id=kind+key;if(pend[id])return;pend[id]=setTimeout(async()=>{delete pend[id];
  const L=(kind==="c"?colL:docL)[key];if(!L||!L.size)return;
  try{const s=kind==="c"?await fetchCol(key):await fetchDoc(key);L.forEach(o=>o.cb(s))}catch(e){L.forEach(o=>o.err&&o.err(e))}},120)}
function touched(p){refresh("c",parent(p));refresh("d",p)}
function ensureChan(){if(chan)return;chan=sb.channel("docs-all").on("postgres_changes",{event:"*",schema:"public",table:"docs"},pl=>{const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path);if(p)touched(p)}).subscribe()}
function listen(map,kind,key,cb,err){const o={cb,err};(map[key]=map[key]||new Set()).add(o);ensureChan();
  (kind==="c"?fetchCol(key):fetchDoc(key)).then(cb,e=>err&&err(e));return()=>map[key].delete(o)}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
async function setDoc(p,d){const {error}=await sb.from("docs").upsert({path:p,col:parent(p),data:JSON.parse(JSON.stringify(d))});if(error)throw error;touched(p)}
async function updDoc(p,patch){const {data,error}=await sb.from("docs").select("data").eq("path",p).maybeSingle();if(error)throw error;if(!data)throw new Error("Document introuvable");
  const nd={...data.data};Object.entries(patch).forEach(([k,v])=>{if(v===undefined)delete nd[k];else nd[k]=v});
  const r=await sb.from("docs").update({data:JSON.parse(JSON.stringify(nd))}).eq("path",p);if(r.error)throw r.error;touched(p)}
async function delDoc(p){const {error}=await sb.from("docs").delete().eq("path",p);if(error)throw error;touched(p)}
const db={
  collection:c=>({onSnapshot:(cb,err)=>listen(colL,"c",c,cb,err),add:async d=>{const id=rid();await setDoc(c+"/"+id,d);return {id}},doc:id=>db.doc(c+"/"+id)}),
  doc:p=>({onSnapshot:(cb,err)=>listen(docL,"d",p,cb,err),set:d=>setDoc(p,d),update:d=>updDoc(p,d),delete:()=>delDoc(p),get:()=>fetchDoc(p)})
};
const user={isOwner:async()=>ROLE.owner,canEdit:async()=>ROLE.member,can:async()=>ROLE.member,id:async()=>session?.user?.id||null,
  me:async()=>({id:session?.user?.id,name:"",email:session?.user?.email}),profiles:async()=>({})};
const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename||"export";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
window.claude={use:async n=>{await ready;if(!ROLE.member)return null;return n==="db"?db:n==="user"?user:n==="downloads"?downloads:null}};
// ---- écran de connexion ----
const $$=id=>document.getElementById(id);
let tab="in",msgTxt="",busy=false;
function logo(){return document.querySelector(".logo img.logo-l")?.getAttribute("src")||""}
function paint(){const el=$$("login");if(!el)return;
  const f=(id,l,t,ac)=>`<div class="field"><label for="${id}">${l}</label>${t==="password"?`<div class="l-pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="l-eye" data-eye="${id}" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>`:`<input id="${id}" type="${t}" autocomplete="${ac}" ${t==="email"?'inputmode="email"':""}>`}</div>`;
  let body="";
  if(tab==="denied")body=`<p class="p-sub">Tu es connecté(e) avec <b>${(session?.user?.email||"").replace(/</g,"&lt;")}</b>, mais cette adresse n'a pas accès au logiciel.</p><div class="p-box">Demande à ton manager de t'inviter avec cette adresse, ou connecte-toi avec une autre.</div><button class="btn ghost p-go" type="button" data-out>Changer de compte</button>`;
  else if(tab==="forgot")body=`<p class="p-sub">Pour des raisons de sécurité, le mot de passe est réinitialisé par un administrateur.</p><div class="p-box">Demande à Damien ou à Hugo de te donner un nouveau mot de passe depuis l'écran Accès & équipes. Tu pourras ensuite le changer.</div><button class="btn ghost p-go" type="button" data-tab="in">Retour à la connexion</button>`;
  else body=`<div class="seg l-tabs" role="tablist"><button type="button" data-tab="in" aria-pressed="${tab==="in"}">Se connecter</button><button type="button" data-tab="up" aria-pressed="${tab==="up"}">Créer mon compte</button></div>
    <form id="lForm" novalidate>${f("lMail","Adresse e-mail","email","email")}${f("lPass",tab==="up"?"Choisis un mot de passe (8 caractères minimum)":"Mot de passe","password",tab==="up"?"new-password":"current-password")}${tab==="up"?f("lPass2","Confirme le mot de passe","password","new-password"):""}
    <p class="err" id="lErr">${msgTxt}</p><button class="btn p-go" id="lGo" type="submit" ${busy?"disabled":""}>${tab==="up"?"Créer mon compte":"Se connecter"}</button></form>
    ${tab==="in"?`<button class="link l-forgot" type="button" data-tab="forgot">Mot de passe oublié ?</button>`:`<p class="p-hint" style="margin-top:12px">Seules les adresses invitées par un manager peuvent créer un compte.</p>`}`;
  const h1=tab==="up"?"Créer mon compte":tab==="denied"?"Accès non autorisé":tab==="forgot"?"Mot de passe oublié":"Bon retour !";
  const sub=tab==="up"?"Utilise l'adresse e-mail à laquelle tu as été invité(e).":tab==="in"?"Connecte-toi à ton espace Meridia.":"";
  el.innerHTML=`<div class="l-wrap"><aside class="l-art" aria-hidden="true"><div class="l-shade"></div>${logo()?`<img class="l-logo" src="${logo()}" alt="">`:""}<div class="l-copy"><h2>Ton activité et ton équipe,<br>au même endroit.</h2><p>Prospection, unités, structure et simulateurs pour les conseillers Meridia.</p></div><a class="l-cred" href="https://unsplash.com" target="_blank" rel="noopener">Photo · Unsplash</a></aside>
  <main class="l-side"><div class="l-form">${logo()?`<img class="p-logo l-mlogo" src="${logo()}" alt="Meridia">`:""}<h1>${h1}</h1>${sub?`<p class="p-sub">${sub}</p>`:""}${body}</div><p class="l-foot">Meridia · espace réservé aux conseillers invités</p></main></div>`}
function showLogin(t){tab=t||"in";msgTxt="";const el=$$("login");el.hidden=false;document.body.classList.add("portal-on");paint();setTimeout(()=>$$("lMail")?.focus(),50)}
function hideLogin(){$$("login").hidden=true;document.body.classList.remove("portal-on")}
document.addEventListener("click",async e=>{const ey=e.target.closest("#login [data-eye]");if(ey){const i=$$(ey.dataset.eye);i.type=i.type==="password"?"text":"password";ey.classList.toggle("on",i.type==="text");return}const t=e.target.closest("#login [data-tab]");if(t){tab=t.dataset.tab;msgTxt="";paint();return}
  if(e.target.closest("#login [data-out]")||e.target.closest("[data-logout]")){await sb.auth.signOut();location.reload()}});
document.addEventListener("submit",async e=>{if(e.target.id!=="lForm")return;e.preventDefault();if(busy)return;
  const email=$$("lMail").value.trim().toLowerCase(),pw=$$("lPass").value,err=m=>{msgTxt=m;busy=false;paint();$$("lMail").value=email};
  if(!email||!pw)return err("Indique ton e-mail et ton mot de passe.");
  busy=true;$$("lGo").disabled=true;
  if(tab==="up"){if(pw!==$$("lPass2").value)return err("Les deux mots de passe ne sont pas identiques.");
    try{const r=await fetch(SB_URL+"/functions/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({email,password:pw})});const j=await r.json().catch(()=>({}));if(!r.ok)return err(j.error||"Création impossible pour le moment.")}catch(x){return err("Connexion au serveur impossible. Vérifie ta connexion.")}}
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)return err(/invalid/i.test(error.message)?"E-mail ou mot de passe incorrect.":"Connexion impossible pour le moment.");
  busy=false;location.reload()});
async function boot(){const {data}=await sb.auth.getSession();session=data.session;
  if(!session){showLogin("in");return}
  const [o,m,k]=await Promise.all([sb.rpc("is_owner"),sb.rpc("is_member"),sb.rpc("my_key")]);
  ROLE.owner=o.data===true;ROLE.member=m.data===true;ROLE.key=k.data||null;window.WEBKEY=ROLE.key;
  if(!ROLE.member){showLogin("denied");return}
  if(ROLE.key&&!ROLE.owner){try{const {data:l}=await sb.from("docs").select("data").eq("path","liens/"+session.user.id).maybeSingle();if(!l||l.data?.key!==ROLE.key)await setDoc("liens/"+session.user.id,{key:ROLE.key})}catch(x){}}
  hideLogin();resolveReady();
  const side=document.querySelector(".side");if(side&&!document.querySelector("[data-logout]")){const b=document.createElement("button");b.type="button";b.className="logout";b.dataset.logout="1";b.textContent="Se déconnecter";side.appendChild(b)}}
sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"){session=null}});
document.addEventListener("DOMContentLoaded",boot);
})();


</script>

<title>Prospection Meridia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#111827; --ink-2:#374151; --muted:#6b7280; --faint:#9ca3af; --line:#e5e7eb; --line-2:#eef0f3; --hover:#f3f4f6;
  --brand:#22355f; --brand-ink:#ffffff; --brand-soft:#e9edf5; --accent:#b8873a;

  --c-ref:#dc2626; --b-ref:#fdecec; --c-old:#a16207; --b-old:#fbf3e2;
  --c-j1:#2563eb; --b-j1:#eaf1fe; --c-j2:#7c3aed; --b-j2:#f1ebfe; --c-j3:#b8873a; --b-j3:#faf2e4; --c-jc:#0e7490; --b-jc:#e3f4f7; --c-fa:#172f6b; --b-fa:#e3ebfb;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --panel:#161a21; --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9ca3af; --faint:#6b7280; --line:#262b34; --line-2:#1e232b; --hover:#1d222a;
  --brand:#8fa8dc; --brand-ink:#0e1116; --brand-soft:#1e2738; --accent:#d6a85a;
  --c-todo:#9ca3af; --b-todo:#20252d; --c-pros:#60a5fa; --b-pros:#162337; --c-rel:#f59e0b; --b-rel:#2c2113;
  --c-rdvc:#a78bfa; --b-rdvc:#231c36; --c-rdvf:#2dd4bf; --b-rdvf:#11292a; --c-sign:#4ade80; --b-sign:#13281b;
  --c-ref:#f87171; --b-ref:#2f1717; --c-old:#eab308; --b-old:#2a2310;
  --c-j1:#60a5fa; --b-j1:#162337; --c-j2:#a78bfa; --b-j2:#231c36; --c-j3:#d6a85a; --b-j3:#2a2212; --c-jc:#22d3ee; --b-jc:#102a30; --c-fa:#8fa8dc; --b-fa:#1e2738; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a21; --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9ca3af; --faint:#6b7280; --line:#262b34; --line-2:#1e232b; --hover:#1d222a;
  --brand:#8fa8dc; --brand-ink:#0e1116; --brand-soft:#1e2738; --accent:#d6a85a;

  --c-rdvc:#a78bfa; --b-rdvc:#231c36; --c-rdvf:#2dd4bf; --b-rdvf:#11292a; --c-sign:#4ade80; --b-sign:#13281b;
  --c-ref:#f87171; --b-ref:#2f1717; --c-old:#eab308; --b-old:#2a2310;
  --c-j1:#60a5fa; --b-j1:#162337; --c-j2:#a78bfa; --b-j2:#231c36; --c-j3:#d6a85a; --b-j3:#2a2212; --c-jc:#22d3ee; --b-jc:#102a30; --c-fa:#8fa8dc; --b-fa:#1e2738; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:72px}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.logo-l{display:block}.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}

/* coque */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.side .logo{padding:4px 10px 18px}
.side .logo img{height:26px;width:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink-2);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-align:left}
.nav button svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav button:hover{background:var(--hover)}
.nav button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
.nav button[aria-selected="true"] svg{color:var(--brand)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--b-rel);color:var(--c-rel);border-radius:6px;padding:1px 6px}
.side-sec{margin:22px 10px 8px;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.goal-mini{margin:0 4px;padding:12px;border:1px solid var(--line);border-radius:10px}
.goal-mini .row1{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.goal-mini b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.topbar h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.mlogo{display:none}.mlogo img{height:22px;width:auto}
.month{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);height:36px}
.month button{border:0;background:transparent;width:32px;height:100%;cursor:pointer;color:var(--muted);font-size:16px}
.month button:hover{color:var(--ink);background:var(--hover)}
.month span{min-width:116px;text-align:center;font-weight:700;font-size:13px;text-transform:capitalize;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;font-weight:700;font-size:13px;border:1px solid transparent;border-radius:8px;padding:0 14px;cursor:pointer;background:var(--brand);color:var(--brand-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.danger{background:transparent;color:var(--c-ref);border-color:color-mix(in srgb,var(--c-ref) 40%,transparent)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.content{padding:24px 28px 60px;padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}

/* widgets */
.grid{display:grid;gap:16px}
.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.c12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s5{grid-column:span 5}.s7{grid-column:span 7}
.w{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.w-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.w-h h3{font-size:13px;font-weight:700;margin:0;color:var(--ink)}
.w-h .sub{font-size:12px;color:var(--muted)}
.w-b{padding:14px 16px 16px}
.link{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:700;cursor:pointer;padding:2px}
.kpi{padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.kpi:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--faint);font-weight:600}
.kpi .f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.delta{font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap}
.delta.up{color:var(--c-sign);background:var(--b-sign)}.delta.down{color:var(--c-ref);background:var(--b-ref)}.delta.eq{color:var(--muted);background:var(--hover)}
.spark{width:84px;height:26px;display:block}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--font);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.line{height:2px;border-radius:0;vertical-align:3px;width:14px}
.goal-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal-head .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal-head .v small{font-size:14px;color:var(--faint);font-weight:600}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--hover);color:var(--ink-2)}
.tag.ok{background:var(--b-sign);color:var(--c-sign)}.tag.ko{background:var(--b-rel);color:var(--c-rel)}
.pipe{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line-2);margin:4px 0 14px}
.pipe i{display:block;height:100%;background:var(--c)}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;cursor:pointer;padding:4px 0;border-radius:6px}
.pl:hover{color:var(--brand)}
.pl b{font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:10px}
.fs{display:grid;grid-template-columns:78px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.fbar{height:22px;background:var(--line-2);border-radius:6px;overflow:hidden}
.fbar i{display:flex;align-items:center;height:100%;background:var(--c);color:#fff;font-size:11px;font-weight:700;padding-left:7px;min-width:26px;font-style:normal;border-radius:6px}
.fs .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.items{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);cursor:pointer;min-width:0}
.it:first-child{border-top:0;padding-top:2px}
.it:hover .t{color:var(--brand)}
.it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.it .t small{font-weight:500;color:var(--muted);margin-left:6px}
.when{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;background:var(--hover);color:var(--muted)}
.when.late{background:var(--b-ref);color:var(--c-ref)}.when.today{background:var(--b-rel);color:var(--c-rel)}.when.rdv{background:var(--b-rdvc);color:var(--c-rdvc)}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--b);color:var(--c)}
.ico svg{width:15px;height:15px}
.none{color:var(--muted);font-size:13px;padding:6px 0}
.lb{display:grid;grid-template-columns:22px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:7px 0;cursor:pointer}
.lb .rk{font-size:12px;font-weight:800;color:var(--faint);text-align:center}
.lb .nm{min-width:0}
.lb .nm div{display:flex;align-items:center;gap:6px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lb .nm .bar{margin-top:5px}
.lb .u{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.feed .it{cursor:pointer}

/* listes */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);height:36px}
.seg button{border:0;background:transparent;padding:0 12px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.seg svg{width:15px;height:15px}
.search{position:relative;flex:1 1 220px}
.search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:32px;height:36px}
.toolbar select{width:auto;height:36px;flex:0 1 180px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink-2)}
.fchip .d{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.fchip b{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.fchip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.table{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thead,.tr{display:grid;grid-template-columns:minmax(0,1.6fr) 150px minmax(0,1.2fr) 90px minmax(0,1.6fr);gap:14px;align-items:center;padding:0 16px}
.thead{height:38px;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);background:var(--bg)}
.tr{min-height:52px;border-top:1px solid var(--line-2);cursor:pointer}
.tr:first-of-type{border-top:0}
.tr:hover{background:var(--hover)}
.gh{padding:8px 16px;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.gh .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;background:var(--b);color:var(--c);flex:none}
.who .n{min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.cell{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.m{color:var(--muted)}
.cell.r{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;border:0;border-radius:6px;padding:4px 8px;background:var(--b);color:var(--c);appearance:none;-webkit-appearance:none;cursor:pointer;max-width:100%}
select.st{width:auto;padding-right:8px}
.badge{display:inline-flex;font-weight:800;font-size:11px;border-radius:6px;padding:2px 7px;background:var(--b);color:var(--c);letter-spacing:.02em}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--bg);padding:12px;color:var(--brand);font-weight:700;cursor:pointer}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--line-2);border-radius:12px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--brand);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:12px;font-weight:800}
.col-h .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col-h .n{color:var(--muted);font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.kc:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.kc.drag{opacity:.4}
.kc .t{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.kc .m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--muted)}
.kc .u{color:var(--c-sign);font-weight:800}
.col .more{background:transparent;border:0;padding:6px;font-size:12px}

/* équipe / objectifs */
.trt{grid-template-columns:minmax(0,1.6fr) 90px minmax(0,1.5fr) 110px 110px}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.prog .bar{flex:1}
.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
.hist th,.hist td{padding:10px 16px;border-top:1px solid var(--line-2);text-align:right;font-size:13px}
.hist th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;border-top:0;background:var(--bg)}
.hist td:first-child,.hist th:first-child{text-align:left;text-transform:capitalize;font-weight:700}
.ok{color:var(--c-sign);font-weight:700}.ko{color:var(--c-rel);font-weight:700}
.tbl{overflow-x:auto}
.check{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.check input{width:16px;height:16px;accent-color:var(--brand)}

/* fiche */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:30;display:flex;justify-content:flex-end}
.sheet{background:var(--panel);width:min(500px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-24px 0 48px -24px rgba(0,0,0,.35)}
.sh-top{position:sticky;top:0;background:var(--panel);z-index:1;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.sh-top h3{font-size:17px;font-weight:800;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--muted)}
.sh-body{padding:18px 20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;flex:1}
.sh-foot{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;gap:8px;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;font-weight:700;color:var(--ink-2)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.steps button .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
.steps button[aria-pressed="true"]{background:var(--b);color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.months{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:13px;text-transform:capitalize}
.sec-t{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding-top:6px;border-top:1px solid var(--line-2)}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);padding:5px 0}
.tl .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tl b{color:var(--ink);font-weight:700}
.ask{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{color:var(--c-ref);font-size:13px;margin:0;min-height:0}
.note{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-size:13px}
.note.warn{background:var(--b-rel);border-color:transparent;color:var(--c-rel);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:12px;z-index:40;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:700;cursor:pointer;padding:4px 10px;border-radius:6px}
.tabbar,.fab{display:none}
@media (prefers-reduced-motion:no-preference){.scrim:not([hidden]) .sheet{animation:slide .18s ease-out}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}

@media (max-width:1100px){.k5{grid-template-columns:repeat(3,minmax(0,1fr))}.s8,.s4,.s6,.s5,.s7{grid-column:span 12}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mlogo{display:block}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar h1{display:none}
  .topbar .month{margin-left:auto}
  .topbar .btn.add{display:none}
  .content{padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .k5 .kpi:first-child{grid-column:span 2}
  .ptitle{display:block!important}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
  .tabbar svg{width:20px;height:20px}
  .tabbar button[aria-selected="true"]{color:var(--brand)}
  .tabbar .cnt{position:absolute;top:4px;left:calc(50% + 6px);font-size:10px;font-weight:800;background:var(--c-rel);color:#fff;border-radius:99px;padding:0 5px}
  .fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);z-index:8;box-shadow:0 10px 24px -6px rgba(0,0,0,.35);cursor:pointer}
  .fab svg{width:22px;height:22px}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .thead{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding-block:10px}
  .tr .cell.hide-m{display:none}
  .tr .cell.meta-m{grid-column:1/-1;white-space:normal;padding-left:40px;color:var(--muted)}
  .trt .prog{grid-column:1/-1;padding-left:40px}
  .plist{grid-template-columns:1fr}
  .board{grid-auto-columns:82%}
}

/* calculateur */
.cprods{display:flex;gap:14px 28px;flex-wrap:wrap;margin-bottom:16px}
.cgrp{display:flex;flex-direction:column;gap:7px;min-width:0}
.cgrp>span{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips .fchip{height:34px;font-size:13px;padding:0 12px}
.cbody{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:16px;align-items:start}
.cres{position:sticky;top:78px}
.chead{align-items:flex-start}
.chead .sub{display:block;margin-top:2px}
.cmini{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:4px 10px;white-space:nowrap}
.csec{padding-bottom:16px}
.csec+.csec{border-top:1px solid var(--line-2);padding-top:14px}
.csec:last-child{padding-bottom:0}
.csec h4{margin:0 0 10px;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cf{display:flex;flex-direction:column;gap:6px;min-width:0}
.cf-w{grid-column:1/-1}
.cf .seg{align-self:flex-start}
.cl{font-size:12px;font-weight:700;color:var(--ink-2)}
.cin{position:relative;display:block}
.cin input{padding-right:42px;height:38px;font-variant-numeric:tabular-nums;font-weight:600}
.cin em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;font-weight:700;color:var(--faint);pointer-events:none}
.cf small{font-size:11px;color:var(--muted)}
.ctot{display:flex;align-items:baseline;gap:8px}
.ctot .v{font-size:42px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ctot span:last-child{color:var(--muted);font-weight:700}
.cobj{font-size:12px;color:var(--muted);margin:6px 0 14px;min-height:4px}
.clines{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.cl2{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.cl2 b{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.cwarns{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cwarn{background:var(--b-rel);color:var(--c-rel);font-size:12px;font-weight:600;border-radius:8px;padding:8px 10px}
.cnotes{margin:12px 0 0;padding-left:16px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.cact{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cdisc{font-size:11px;color:var(--faint);margin-top:12px}
.lab-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab-row label{font-size:12px;font-weight:700;color:var(--ink-2)}
.ccompact{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.ccompact .cgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.ccompact .csec{padding:0}.ccompact .csec+.csec{padding-top:12px}
.ccompact .ctot .v{font-size:30px}
.ccompact .cobj{display:none}
.ccompact .cact{margin-top:12px;padding-top:0;border:0}
.ccompact input,.ccompact select{background:var(--panel)}
@media (max-width:1100px){.cbody{grid-template-columns:minmax(0,1fr)}.cres{position:static}}
@media (max-width:860px){.chead{position:sticky;top:61px;z-index:2;background:var(--panel);border-radius:12px 12px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line-2)}.cprods{gap:12px}}
body[data-view="calc"] .fab{display:none!important}
.lab-row .link{padding:0;line-height:1.3}
.navlink{display:flex;align-items:center;gap:10px;color:var(--ink-2);padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;margin-top:2px}
.navlink svg{width:18px;height:18px;flex:none;color:var(--muted)}
.navlink em{margin-left:auto;font-style:normal;color:var(--faint);font-size:12px}
.navlink:hover{background:var(--hover)}
.resban{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;text-decoration:none;color:var(--ink)}
.resban:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.resban .t{flex:1;min-width:0;display:flex;flex-direction:column}
.resban small{color:var(--muted);font-size:12px}
.live{font-weight:700;color:var(--c-sign)}.live.new{color:var(--c-rel)}
.lvl{color:var(--faint);margin-right:-2px;font-size:13px}
.quick{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.quick .lab{font-size:12px;font-weight:700;color:var(--ink-2)}
.quick small{font-size:12px;color:var(--muted)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px}
.qrow input,.qrow select{background:var(--panel);height:36px}
#tSaisie{flex-wrap:wrap;height:auto}#tSaisie button{height:34px}

/* assistant RDV */
.asst{display:none;position:sticky;top:0;height:100vh;background:var(--panel);border-left:1px solid var(--line);flex-direction:column;min-width:0}
body.asst-open .app{grid-template-columns:232px minmax(0,1fr) 390px}
body.asst-open .asst{display:flex}
.asst-btn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.asst-h{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.asst-h h3{margin:0;font-size:14px;font-weight:800}
.asst-h small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.asst-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.asst-sugg{display:flex;flex-wrap:wrap;gap:6px}
.asst-sugg button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;text-align:left}
.asst-sugg button:hover{border-color:var(--brand);color:var(--brand)}
.asst-hint{font-size:12px;color:var(--muted)}
.qb{align-self:flex-end;background:var(--brand);color:var(--brand-ink);padding:8px 12px;border-radius:12px 12px 4px 12px;max-width:90%;font-weight:600;font-size:13px;white-space:pre-wrap}
.ab{display:flex;flex-direction:column;gap:8px;font-size:14px}
.ab .say{border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px;line-height:1.55;color:var(--ink)}

.ab .lbl{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.ab .wait{color:var(--muted);font-size:13px}
.ab .aerr{color:var(--c-rel);font-size:13px;font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;text-align:left}
.rel button[aria-expanded="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.kbf{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);font-size:13px;line-height:1.55;color:var(--ink-2)}
.kbf>*{margin:0 0 8px}.kbf h5{font-size:14px;color:var(--ink);margin-bottom:6px}.kbf h6{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);margin:12px 0 6px}
.kbf ul{padding-left:18px}.kbf .say{border-left:3px solid var(--brand);background:var(--panel);padding:8px 10px;border-radius:0 8px 8px 0;color:var(--ink)}
.kbf .him{padding-left:12px;color:var(--muted);font-style:italic}.kbf .cue{color:var(--c-rel);font-weight:700;font-size:12px}
.asst-f{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.asst-f textarea{min-height:42px;max-height:140px;resize:none;line-height:1.4}
.asst-f .btn{height:42px}
@media (max-width:1180px){body.asst-open .app{grid-template-columns:232px minmax(0,1fr) 340px}}
@media (max-width:860px){body.asst-open .app{grid-template-columns:1fr}.asst{position:fixed;inset:0;z-index:25;height:auto}.asst-btn span{display:none}.asst-btn{padding:0 10px}}
.eur{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.bar3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.bar3 .cin input{padding-right:38px}

.cash-b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.cash-k{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-content:start}
.cash-k>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.cash-k .l{font-size:12px;font-weight:600;color:var(--muted)}
.cash-k .v{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.cash-k .v.ok{color:var(--c-sign)}
.cash-k .s{font-size:12px;color:var(--muted)}
.cash-c{grid-column:1/-1}
.cbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:112px;margin-top:6px}
.cb{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.cb i{display:block;width:70%;max-width:34px;background:var(--brand);border-radius:4px 4px 2px 2px}
.cb span{font-size:11px;color:var(--muted)}.cb .cbv{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cash-l .lbl{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.cash-l .it .btn{flex:none}
@media (max-width:860px){.cash-b{grid-template-columns:minmax(0,1fr)}.cash-k .v{font-size:24px}}
.bars-set{display:flex;flex-direction:column;gap:8px}.bset{display:grid;grid-template-columns:52px 70px minmax(0,1fr);gap:6px;align-items:center}.bset b{font-size:12px}.bset input,.bset select{height:34px;padding:6px 8px}
.ptitle{display:none;font-size:22px;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}

/* ===== habillage « soft UI » : toile bleutée, cartes très arrondies, chiffres fins ===== */
:root{--canvas:#dfe7f3;--canvas-2:#eef3fa;--shell:rgba(255,255,255,.62);--shell-line:rgba(255,255,255,.9);
  --bg:#f3f6fb;--panel:#ffffff;--line:#e4eaf3;--line-2:#edf1f7;--hover:#eef3fb;
  --brand:#1f3c88;--brand-ink:#ffffff;--brand-soft:#e3ebfb;--blue:#3b73e6;--blue-soft:#dfe9fd;--navy:#172f6b;
  --r-card:24px;--r-ctl:999px;--shadow:0 1px 2px rgba(24,48,96,.04),0 8px 24px -12px rgba(24,48,96,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--canvas:#0a0f1a;--canvas-2:#0e1524;--shell:rgba(20,27,43,.7);--shell-line:rgba(255,255,255,.06);
  --bg:#111827;--panel:#151d2e;--line:#232d42;--line-2:#1c2538;--hover:#1c2640;--brand:#8fb0f5;--brand-ink:#0b1220;--brand-soft:#1d2a47;--blue:#6f9cf5;--blue-soft:#1b2a4a;--navy:#1a2c57;--shadow:none}}
:root[data-theme="dark"]{--canvas:#0a0f1a;--canvas-2:#0e1524;--shell:rgba(20,27,43,.7);--shell-line:rgba(255,255,255,.06);
  --bg:#111827;--panel:#151d2e;--line:#232d42;--line-2:#1c2538;--hover:#1c2640;--brand:#8fb0f5;--brand-ink:#0b1220;--brand-soft:#1d2a47;--blue:#6f9cf5;--blue-soft:#1b2a4a;--navy:#1a2c57;--shadow:none}
body{background:radial-gradient(1200px 600px at 10% -10%,var(--canvas-2),transparent 60%),radial-gradient(900px 600px at 110% 10%,var(--canvas-2),transparent 55%),var(--canvas);background-attachment:fixed}
.app{margin:18px;min-height:calc(100vh - 36px);background:var(--shell);border:1px solid var(--shell-line);border-radius:32px;box-shadow:0 30px 60px -30px rgba(24,48,96,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.side{background:transparent;border-right:0;top:18px;height:calc(100vh - 36px);padding:22px 14px}
.side .logo{padding:4px 12px 22px}
.nav{gap:4px}
.nav button,.navlink{border-radius:var(--r-ctl);padding:9px 14px;font-weight:600}
.nav button:hover,.navlink:hover{background:rgba(255,255,255,.7)}
.nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 16px -8px rgba(31,60,136,.6)}
.nav button[aria-selected="true"] svg{color:var(--brand-ink)}
.goal-mini{background:var(--panel);border:0;border-radius:20px;box-shadow:var(--shadow);padding:14px}
.bar{height:8px}
.topbar{background:transparent;border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:10px}
.topbar h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.month,.btn,.seg,.chip,.fchip,.tag,.delta,.when,.pill,.cnt{border-radius:var(--r-ctl)!important}
.month{background:var(--panel);border-color:transparent;box-shadow:var(--shadow);height:40px;padding:0 4px}
.month span{border:0;line-height:38px}
.btn{height:40px;padding:0 18px}
.btn.sm{height:32px;padding:0 12px}
.btn.ghost{background:var(--panel);border-color:transparent;box-shadow:var(--shadow)}
.btn:not(.ghost):not(.danger){background:var(--brand);box-shadow:0 8px 18px -10px rgba(31,60,136,.7)}
input,select,textarea{border-radius:14px;border-color:var(--line);background:var(--panel)}
.content{padding-top:12px}
.grid{gap:18px}
.w{border:0;border-radius:var(--r-card);box-shadow:var(--shadow)}
.w-h{padding:20px 22px 0}
.w-h h3{font-size:15px;font-weight:600}
.w-b{padding:16px 22px 22px}
.kpi{border:0;padding:20px 22px;gap:10px}
.kpi .l{font-size:13px;font-weight:500}
.kpi .v{font-size:38px;font-weight:300;letter-spacing:-.04em}
.kpi .v small{font-size:14px;font-weight:500}
.goal-head .v,.cash-k .v,.ctot .v{font-weight:300;letter-spacing:-.04em}
.goal-head .v{font-size:44px}
.cash-k .v{font-size:36px}
.ctot .v{font-size:52px}
.cbars i,.cb i{border-radius:999px!important;width:42%!important}
.pipe{height:14px}
.fbar,.fbar i{border-radius:999px}
.sheet{border-radius:28px 0 0 28px;border-left:0}
.sh-top{border-radius:28px 0 0 0}
.thead,.tr{border-color:var(--line-2)}
.tbl,.table{border-radius:var(--r-card)}
.asst{background:var(--panel);border-left:0;border-radius:28px;margin:18px 18px 18px 0;height:calc(100vh - 36px);top:18px;box-shadow:var(--shadow)}
.empty{border-radius:var(--r-card)}
.table,.resban{border:0;border-radius:var(--r-card);box-shadow:var(--shadow)}
.kc{border:0;border-radius:16px;box-shadow:var(--shadow)}
.ccompact,.quick,.kbf{border-radius:18px}
.col{border-radius:22px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.goal-head .v small,.kpi .v small{letter-spacing:0}
body[data-view="dash"] .topbar h1{visibility:hidden}
.seg-i.s1>b,.seg-i.s3>b{color:var(--brand-ink)}
@media (max-width:860px){body[data-view="dash"] .ptitle{display:none!important}}

/* --- retouches visuelles --- */
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero.hero{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.hero .bigs{justify-content:flex-start;margin-top:20px;gap:36px}
.gauge{display:grid;grid-template-columns:160px minmax(0,auto);align-items:center;gap:20px;background:var(--panel);border:0;border-radius:28px;box-shadow:var(--shadow);padding:18px 26px 18px 18px;cursor:pointer;text-align:left;color:var(--ink)}
.gauge:hover{box-shadow:0 0 0 2px var(--blue-soft),var(--shadow)}
.gauge .ring,.gauge .gc{grid-row:1;grid-column:1}
.gc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gn{font-size:36px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.gs{font-size:11px;color:var(--muted);font-weight:500}
.gp{margin-top:4px;font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 8px}
.gl{display:flex;flex-direction:column;gap:8px;min-width:150px}
.gl b{font-size:15px;font-weight:600}
.gl small{font-size:12px;color:var(--muted)}
.seg-i>span .sn{font-weight:700;color:var(--ink)}
.cbars{height:84px}
.cb i.z{opacity:.35}
body[data-view="dash"] .side-sec,body[data-view="dash"] .goal-mini{display:none}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-radius:999px;box-shadow:var(--shadow);margin:auto 4px 0}
.side-foot .fn{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.side-foot .fn b{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .fn small{font-size:11px;color:var(--muted)}
.av.me{width:34px;height:34px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--brand));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.av{border-radius:999px!important}
.av.ph{padding:0;overflow:hidden;background:var(--line-2)}
.av.ph img{width:100%;height:100%;object-fit:cover;display:block}
.av.xs{width:22px;height:22px;font-size:9px;display:inline-grid;place-items:center;vertical-align:middle;margin-right:2px}
.av.lg{width:58px;height:58px;font-size:18px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--brand);font-weight:700}
.phrow{display:flex;align-items:center;gap:14px}
.w.dark{align-self:start}
@media (prefers-reduced-motion:no-preference){
  .anim .seg-i>b{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left center}
  .anim .ring-p{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both}
  .anim .cb i{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
  .anim .w,.anim .gauge{animation:fadeUp .5s ease-out both}
  .anim .grid>*:nth-child(2){animation-delay:.05s}.anim .grid>*:nth-child(3){animation-delay:.1s}.anim .grid>*:nth-child(4){animation-delay:.15s}
}
@keyframes grow{from{transform:scaleX(.15);opacity:.4}}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@media (max-width:1180px){.hero.hero{grid-template-columns:minmax(0,1fr)}.gauge{justify-self:start}}
@media (max-width:860px){
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:14px 16px;gap:6px}.kpi .v{font-size:28px}.kpi .spark{width:64px;height:22px}
  .gauge{grid-template-columns:130px minmax(0,1fr);padding:14px;gap:14px;width:100%}.gauge .ring{width:130px;height:130px}.gn{font-size:30px}
  .hero .bigs{gap:22px}.gl{min-width:0}
}
/* fond blanc (mode clair) */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) body{background:#fff}:root:not([data-theme="dark"]) .app{background:#fff;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  :root:not([data-theme="dark"]) .w,:root:not([data-theme="dark"]) .gauge,:root:not([data-theme="dark"]) .table,:root:not([data-theme="dark"]) .resban,:root:not([data-theme="dark"]) .goal-mini,:root:not([data-theme="dark"]) .side-foot{box-shadow:0 1px 2px rgba(24,48,96,.05),0 10px 30px -14px rgba(24,48,96,.16);outline:1px solid #eef1f6}
  :root:not([data-theme="dark"]) .w.dark{outline:0}
  :root:not([data-theme="dark"]) .nav button:hover,:root:not([data-theme="dark"]) .navlink:hover{background:#f2f5fa}
  :root:not([data-theme="dark"]) .tabbar{background:rgba(255,255,255,.94)}}
:root[data-theme="light"] body,:root[data-theme="light"] .app{background:#fff;box-shadow:none;border-color:transparent}
/* carte sombre */
.w.dark{background:linear-gradient(160deg,var(--navy),#0f2253);color:#fff}
.w.dark h3{color:#fff}.w.dark .link{color:#bcd0ff}
.w.dark .it{border-color:rgba(255,255,255,.1)}.w.dark .it .t{color:#fff}.w.dark .it .t small{color:#aebfe6}.w.dark .it:hover .t{color:#cfe0ff}
.w.dark .ico{background:rgba(255,255,255,.12)!important;color:#fff!important;border-radius:999px}
.w.dark .when{background:rgba(255,255,255,.14);color:#fff}.w.dark .when.late{background:#ef4444;color:#fff}.w.dark .when.today{background:#f59e0b;color:#111}

/* en-tête du tableau de bord */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;margin:4px 0 22px}
.hello{margin:0;font-size:40px;font-weight:300;letter-spacing:-.035em;line-height:1.1}

.seg-i.s2>b{background:var(--navy)}.seg-i.s3>b{background:var(--blue)}

let db=null,dl=null,canWrite=true,P=[],T=[],CFG={objectifMensuel:1500,objectifs:{},inclureEquipe:true};

let BAR={JFA1:{t:"c",v:50},JFA2:{t:"u",v:2},JFA3:{t:"u",v:3},JFAC:{t:"u",v:3},FA:{t:"u",v:3.5}};
const barOf=st=>{const b=BAR?.[st||"JFA1"];if(b===null||b===undefined||b==="")return null;if(typeof b==="number")return{t:"u",v:b};return b.v===null||b.v===undefined||b.v===""?null:{t:b.t==="c"?"c":"u",v:Number(b.v)}};
const barTxt=st=>{const b=barOf(st);return b?`${String(b.v).replace(".",",")} € par ${b.t==="c"?"contrat démarré":"unité"}`:"barème à renseigner"};

const MODS=[["dash","Tableau de bord"],["pros","Prospects"],["cli","Clients"],["calc","Calculateur"],["simu","Simulateur SEP"],["car","Simulateur carrière"],["team","Équipe"],["obj","Objectifs"],["struct","Structure"],["res","Ressources"]];

function deriveStruct(){const rl={};Object.entries(LIENS).forEach(([u,l])=>{if(l&&l.key)rl[l.key]=u});STRUCT.forEach(p=>{if(!p.uid&&rl[p.id])p.uid=rl[p.id]});SKIDS={};const ids=new Set(STRUCT.map(p=>p.id));STRUCT.forEach(p=>{const m=p.manager&&ids.has(p.manager)&&p.manager!==p.id?p.manager:"";(SKIDS[m]=SKIDS[m]||[]).push(p)});
  MYKEY=MODE==="manager"?(STRUCT.find(p=>SELF&&p.uid===SELF)?.id||(SP("damien-paulot")?"damien-paulot":null)):(LIENS[UID]?.key||ME?.key||STRUCT.find(p=>UID&&p.uid===UID)?.id||null)}
function sdown(id){const out=[],seen=new Set([id]),st=[...(SKIDS[id]||[])];while(st.length){const p=st.shift();if(seen.has(p.id))continue;seen.add(p.id);out.push(p);st.push(...(SKIDS[p.id]||[]))}return out}
const visS=()=>isMega()?STRUCT:MYKEY&&meS()?[meS(),...sdown(MYKEY)]:[];
const canManage=id=>isMega()||(isSuper()&&(id===MYKEY||sdown(MYKEY).some(p=>p.id===id)));
function myMods(){if(isSuper())return ALLM;const p=meS(),D=DROITS||DROITS0;if(p?.mods)return p.mods;const st=p?.statut||myStatut();const k=SST.indexOf(st)>4?"FA":st;return D[k]||DROITS0[k]||DROITS0.JFA1}

  if(WANT&&WANT!==view&&VV().some(x=>x[0]===WANT))setView(WANT);else if(!VV().some(x=>x[0]===view))setView("dash");else document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view))}

// --- vue Structure ---
function spCard(p,cls=""){const dn=sdown(p.id),u=aslU(p.id),st=p.statut||"JFA1",mg=canManage(p.id);

  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${cx}" cy="${cx}" r="${cx-2}" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="1.5 5"/><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="${sw}"/><circle class="ring-p" style="--c:${c}" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--blue)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${cx} ${cx})"/></svg>`}
const photoUrl=t=>t?.photo?.id?"/_blob/"+t.photo.id:"";
const avatar=(t,cls="av")=>photoUrl(t._raw||t)?`<span class="${cls} ph"><img src="${photoUrl(t._raw||t)}" alt=""></span>`:`<span class="${cls}" style="${jv(t.statut)}">${esc(initials(t.nom))}</span>`;
function countUp(root){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;root.querySelectorAll("[data-count]").forEach(el=>{const to=Number(el.dataset.count)||0;if(!to)return;const t0=performance.now(),d=800;
  const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(step);else el.textContent=fmt(to)};requestAnimationFrame(step)})}
function paintFoot(){const nm=MODE==="member"?(ME?.nom||""):"Damien Paulot";$("sideFoot").innerHTML=nm?`<span class="av me">${esc(initials(nm))}</span><span class="fn"><b>${esc(nm)}</b><small>${esc(myStatut())}${MODE==="manager"?" · manager":""}</small></span>`:""}

const info=t=>`<span class="info" tabindex="0" role="img" aria-label="${esc(t)}" data-tip="${esc(t)}">i</span>`;
// ---------- argent ----------
function cashWidget(){const st=myStatut(),pend=pendingStart(),now=month;
  const done=sumPay(startedList(now)),pe=sumPay(pend),late=pend.filter(p=>p.dateDebut&&p.dateDebut<today());
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(now,-i));const vals=ms.map(m=>sumPay(startedList(m)).e),mx=Math.max(1,...vals);
  const miss=done.miss+pe.miss;const pay=p=>{const v=payOf(p);return v===null?"barème ?":eurN(v)};
  const bars=`<div class="cbars">${ms.map((m,i)=>`<div class="cb"><span class="cbv">${vals[i]?fmt(vals[i]):""}</span><i class="${vals[i]?"":"z"}" style="height:${Math.max(vals[i]?6:2,vals[i]/mx*48)}px;${m===now?"background:var(--c-sign)":""}"></i><span>${monthShort(m)}</span></div>`).join("")}</div>`;
  return `<div class="w cash" style="margin-top:16px"><div class="w-h"><div><h3>Mon argent</h3><div class="sub">${esc(st)} : ${esc(barTxt(st))} ${info("Les unités se gagnent à la signature du contrat. L'argent, lui, arrive quand le contrat démarre.")}</div></div><button class="link" type="button" data-go="cli">Mes clients</button></div>
  <div class="w-b cash-b"><div class="cash-k">
    <div><span class="l">Démarré · ${esc(monthName(now))}</span><span class="v ok">${eurN(done.e)}</span><span class="s">${startedList(now).length} contrat${startedList(now).length>1?"s":""}</span></div>
    <div><span class="l">En attente de démarrage</span><span class="v">${eurN(pe.e)}</span><span class="s">${pend.length} contrat${pend.length>1?"s":""}${late.length?` · <b class="ko">${late.length} en retard</b>`:""}</span></div>
    ${miss?`<div class="cash-c"><span class="s ko">${miss} contrat${miss>1?"s":""} sans barème : renseigne-le dans Objectifs.</span></div>`:""}
    <div class="cash-c"><span class="l">Démarré par mois (€)</span>${bars}</div></div>
  <div class="cash-l"><div class="lbl">À démarrer</div>${pend.length?`<div class="items">${pend.slice(0,6).map(p=>{const d=p.dateDebut,n=d?daysFrom(d):null;const w=!d?`<span class="when">date à fixer</span>`:n<0?`<span class="when late">prévu ${dmy(d)}</span>`:`<span class="when ${n===0?"today":""}">${n===0?"aujourd'hui":dmy(d)}</span>`;
    return `<div class="it" data-open="${esc(p.id)}"><span class="t">${esc(p.nom)}<small>${fmt(p.unites)} u · ${pay(p)} · ${esc(remSt(p))}</small></span>${w}${canWrite?`<button class="btn ghost sm" type="button" data-start="${esc(p.id)}">Démarré</button>`:""}</div>`}).join("")}</div>${pend.length>6?`<button class="link" type="button" data-go="cli">+ ${pend.length-6} autres</button>`:""}`:`<div class="none">Aucun contrat en attente de démarrage.</div>`}</div></div></div>`}
async function markStarted(p){if(!p)return;const prev={demarre:p.demarre??null,dateDebut:p.dateDebut??null};const d=p.dateDebut&&p.dateDebut<=today()?p.dateDebut:today();
  try{await db.doc(PROS+"/"+p.id).update({demarre:true,dateDebut:d,maj:today()});toast(`${p.nom} : contrat démarré`,async()=>{try{await db.doc(PROS+"/"+p.id).update(prev)}catch(e){fail(e)}})}catch(e){fail(e)}}

// ---------- tableau de bord ----------
function renderDash(){
  if(!loaded){$("v-dash").innerHTML='<div class="empty">Chargement de tes données…</div>';return}
  const pm=shiftMonth(month,-1),six=[];for(let i=5;i>=0;i--)six.push(shiftMonth(month,-i));
  const obj=objOf(month),me=myUnits(month),tm=teamUnits(month),tot=me+(CFG.inclureEquipe?tm:0);
  const kpis=[
    {l:"Mes unités",v:fmt(me),u:1,d:delta(me,myUnits(pm)),s:spark(six.map(myUnits),"var(--blue)"),go:"cli"},
    MODE==="member"?{l:"À relancer",v:dueRelances().length,d:'<span class="delta eq">aujourd\'hui</span>',s:"",f:"relance",novs:1}:{l:"Unités équipe",v:fmt(tm),u:1,d:delta(tm,teamUnits(pm)),s:spark(six.map(teamUnits),"var(--blue)"),go:"team"},
    {l:"Contrats signés",v:signedCount(month),d:delta(signedCount(month),signedCount(pm)),s:spark(six.map(signedCount),"var(--blue)"),go:"cli"},
    {l:"RDV",v:rdvCount(month),d:delta(rdvCount(month),rdvCount(pm)),s:spark(six.map(rdvCount),"var(--blue)"),f:"rdv_cale"},
  ];
  const now=ym(today()),[y,mo]=month.split("-").map(Number),dim=new Date(y,mo,0).getDate();
  let paceTag="",paceTxt="";
  if(month===now){const d=new Date().getDate(),left=dim-d+1,rest=Math.max(0,obj-tot),expected=obj*(d/dim);
    paceTag=tot>=expected?`<span class="tag ok">En avance sur le rythme</span>`:`<span class="tag ko">En retard de ${fmt(expected-tot)} u</span>`;
    paceTxt=rest?`Il reste ${fmt(rest)} unités en ${left} jours, soit ${fmt(Math.ceil(rest/left))} par jour.`:`Objectif atteint : ${fmt(tot-obj)} unités d'avance.`}
  else if(month<now){paceTag=tot>=obj?`<span class="tag ok">Objectif atteint</span>`:`<span class="tag ko">${Math.round(obj?tot/obj*100:0)} % de l'objectif</span>`}
  // pipeline
  const cnt={};P.forEach(p=>cnt[p.statut]=(cnt[p.statut]||0)+1);
  const pst=STATUTS.filter(s=>cnt[s.k]);const totP=P.length||1;
  // entonnoir
  const base=P.filter(p=>p.statut!=="valide").length||1;
  const contacted=P.filter(p=>!["a_prospecter","valide"].includes(p.statut)).length;
  const rdv=P.filter(p=>["rdv_cale","rdv_fait","signe"].includes(p.statut)).length;
  const sig=P.filter(p=>p.statut==="signe").length;
  const fs=[["Contacts",base,"pros",null],["Contactés",contacted,"rel",contacted/base],["RDV",rdv,"rdvc",contacted?rdv/contacted:0],["Signés",sig,"sign",rdv?sig/rdv:0]];
  // agenda
  const t=today(),wk=addDays(7);
  const ag=[...P.filter(p=>p.statut==="rdv_cale"&&p.dateRdv&&p.dateRdv>=t&&p.dateRdv<=wk).map(p=>({p,d:p.dateRdv,k:"rdv"})),
    ...P.filter(p=>p.statut==="relance"&&(!p.dateRelance||p.dateRelance<=wk)).map(p=>({p,d:p.dateRelance||"",k:"rel"}))]
    .sort((a,b)=>(a.d||"0").localeCompare(b.d||"0"));
  const later=[...P.filter(p=>p.statut==="rdv_cale"&&p.dateRdv>wk).map(p=>({p,d:p.dateRdv,k:"rdv"})),...P.filter(p=>p.statut==="relance"&&p.dateRelance>wk).map(p=>({p,d:p.dateRelance,k:"rel"}))].sort((a,b)=>a.d.localeCompare(b.d)).slice(0,4);
  // équipe
  const topTeam=[...T].sort((a,b)=>(Number(b.unites?.[month])||0)-(Number(a.unites?.[month])||0)).slice(0,5);
  const maxT=Math.max(1,...topTeam.map(x=>Number(x.unites?.[month])||0));
  // recos
  const recMap={};P.forEach(p=>{const n=(p.recommandation||"").trim();if(n){const k=norm(n);recMap[k]=recMap[k]||{n,c:0};recMap[k].c++}});
  const recs=Object.values(recMap).sort((a,b)=>b.c-a.c).slice(0,5);
  // activité
  const feed=[];P.forEach(p=>(Array.isArray(p.historique)?p.historique:[]).forEach(h=>feed.push({p,h})));
  feed.sort((a,b)=>String(b.h.d).localeCompare(String(a.h.d)));
  const first=(MODE==="member"?(ME?.nom||""):"Damien").split(" ")[0];
  const pc=x=>Math.round(Math.max(0,Math.min(1,x))*100);
  const segv=[["Contactés",pc(contacted/base),"s1",`${contacted} sur ${base} contacts`],["RDV",pc(contacted?rdv/contacted:0),"s2",`${rdv} sur ${contacted} contactés`],["Signés",pc(rdv?sig/rdv:0),"s3",`${sig} sur ${rdv} RDV`],["Objectif",pc(obj?tot/obj:0),"goal",`${fmt(tot)}/${fmt(obj)}`]];
  const hero=`<section class="hero"><div><h2 class="hello">Bonjour ${esc(first)}</h2><div class="hsub">Voici où tu en es en ${esc(monthName(month))}.</div>
    <div class="segs">${segv.map(([l,v,c,n])=>`<div class="seg-i ${c}" style="flex:${Math.max(16,v)} 1 0"><span><b class="sn">${l}</b> · ${n}</span><b>${v} %</b></div>`).join("")}</div>
    <div class="bigs"><div class="big"><span class="lb2"><i>${svgI("pros")}</i>Contacts</span><span class="n" data-count="${P.length}">${P.length}</span></div>
    <div class="big"><span class="lb2"><i>${svgI("cal")}</i>RDV calés</span><span class="n" data-count="${P.filter(p=>p.statut==="rdv_cale").length}">${P.filter(p=>p.statut==="rdv_cale").length}</span></div></div></div>
    <button type="button" class="gauge" data-go="obj" aria-label="Objectif du mois : ${fmt(tot)} unités sur ${fmt(obj)}">${ring(tot,obj)}<span class="gc"><span class="gn" data-count="${tot}">${fmt(tot)}</span><span class="gs">/ ${fmt(obj)} unités</span><b class="gp">${obj?Math.round(tot/obj*100):0} %</b></span>
    <span class="gl"><b>Objectif du mois</b><span>${paceTag||""}</span>${CFG.inclureEquipe&&tm?`<small>dont ${fmt(tm)} u équipe</small>`:""}</span></button></section>`;
  $("v-dash").innerHTML=`${hero}
  ${cashWidget().replace('style="margin-top:16px"','style="margin-bottom:18px"')}
  <div class="grid k4">${kpis.map(k=>`<button type="button" class="w kpi" ${k.go?`data-go="${k.go}"`:`data-filt="${k.f}"`}><span class="l">${k.l}</span><span class="v${k.u?" units":""}"><span${/^\d+$/.test(String(k.v))?` data-count="${k.v}"`:""}>${k.v}</span>${k.u?"<small> u</small>":""}</span><span class="f"><span class="dv">${k.d}${k.novs?"":`<small class="vs">vs ${monthShort(pm)}</small>`}</span>${k.s}</span></button>`).join("")}</div>
  <div class="grid c12" style="margin-top:16px">
    <div class="w s8"><div class="w-h"><div><h3>Progression vers l'objectif</h3><div class="sub">Unités cumulées jour après jour · ${esc(monthName(month))}</div></div>${paceTag}</div>
      <div class="w-b"><div class="goal-head"><span class="sub" style="color:var(--muted);font-size:13px">${paceTxt||`${fmt(tot)} unités sur ${fmt(obj)}`}</span></div>${progressChart()}
      <div class="legend"><span><i class="sw" style="background:var(--brand)"></i>Unités cumulées${CFG.inclureEquipe&&tm?` (dont ${fmt(tm)} équipe)`:""}</span><span><i class="sw line" style="background:var(--faint)"></i>Rythme nécessaire</span><span><i class="sw line" style="background:var(--accent)"></i>Objectif</span></div></div></div>
    <div class="w s4 dark"><div class="w-h"><h3>À faire</h3><button class="link" type="button" data-filt="relance">Tout voir</button></div>
      <div class="w-b"><div class="items">${ag.length?ag.slice(0,8).map(a=>{const n=a.d?daysFrom(a.d):-1;const cls=a.k==="rdv"?"rdv":!a.d||n<0?"late":n===0?"today":"";return `<div class="it" tabindex="0" data-open="${esc(a.p.id)}"><span class="ico" style="${cv(a.k==="rdv"?"rdvc":"rel")}">${svgI(a.k==="rdv"?"cal":"bell")}</span><span class="t">${esc(a.p.nom)}<small>${a.k==="rdv"?"RDV":"Relance"}</small></span><span class="when ${cls}">${a.d?(a.k==="rdv"&&n>1?dmy(a.d):rel(a.d)):"sans date"}</span></div>`}).join("")+(ag.length>8?`<div class="none">+ ${ag.length-8} autres</div>`:""):(later.length?`<div class="none" style="padding-top:0">Rien d'urgent cette semaine. Ensuite :</div>${later.map(a=>`<div class="it" tabindex="0" data-open="${esc(a.p.id)}"><span class="ico">${svgI(a.k==="rdv"?"cal":"bell")}</span><span class="t">${esc(a.p.nom)}<small>${a.k==="rdv"?"RDV":"Relance"}</small></span><span class="when">${dmy(a.d)}</span></div>`).join("")}`:'<div class="none">Rien de prévu pour l\'instant. Profite-en pour prospecter.</div>')}</div></div></div>
    <div class="w s7"><div class="w-h"><div><h3>Pipeline</h3><div class="sub">${P.length} contacts par étape</div></div><button class="link" type="button" data-pipe>Ouvrir le pipeline</button></div>
      <div class="w-b"><div class="pipe">${pst.map(s=>`<i style="${stv(s.k)};width:${cnt[s.k]/totP*100}%" title="${s.l}"></i>`).join("")}</div>
      <div class="plist">${pst.map(s=>`<div class="pl" tabindex="0" data-filt="${s.k}"><span><i class="sw" style="background:var(--c-${s.v})"></i>${s.l}</span><b>${cnt[s.k]} <span style="color:var(--faint);font-weight:600">· ${Math.round(cnt[s.k]/totP*100)} %</span></b></div>`).join("")}</div></div></div>
    <div class="w s5"><div class="w-h"><div><h3>Taux de conversion</h3><div class="sub">De la prise de contact à la signature</div></div></div>
      <div class="w-b"><div class="funnel">${fs.map(([l,n,c,p])=>`<div class="fs" style="${cv(c)}"><span>${l}</span><div class="fbar"><i style="width:${Math.max(7,n/base*100)}%">${fmt(n)}</i></div><span class="pct">${p==null?"":Math.round(p*100)+" %"}</span></div>`).join("")}</div></div></div>
    <div class="w s6"><div class="w-h"><div><h3>6 derniers mois</h3><div class="sub">Unités moi + équipe face à l'objectif</div></div><button class="link" type="button" data-go="obj">Détail</button></div>
      <div class="w-b">${monthsChart(6,200)}<div class="legend"><span><i class="sw" style="background:var(--brand)"></i>Moi</span><span><i class="sw" style="background:var(--accent)"></i>Équipe</span><span><i class="sw line" style="background:var(--c-ref)"></i>Objectif</span></div></div></div>
    <div class="w s6"><div class="w-h"><div><h3>${T.length?"Classement équipe":"Meilleurs recommandeurs"}</h3><div class="sub">${T.length?esc(monthName(month)):"Contacts apportés par recommandation"}</div></div><button class="link" type="button" data-go="${T.length?"team":"pros"}">Voir</button></div>
      <div class="w-b">${T.length?topTeam.map((x,i)=>{const u=Number(x.unites?.[month])||0;return `<div class="lb" tabindex="0" data-team="${esc(x.id)}"><span class="rk">${i+1}</span><div class="nm"><div>${avatar(x,"av xs")}${esc(x.nom)} <span class="badge" style="${jv(x.statut)}">${esc(x.statut||"JFA1")}</span></div><div class="bar"><i style="width:${u/maxT*100}%;background:var(--blue)"></i></div></div><span class="u">${fmt(u)} u</span></div>`}).join(""):
        recs.length?recs.map((x,i)=>`<div class="lb"><span class="rk">${i+1}</span><div class="nm"><div>${esc(x.n)}</div><div class="bar"><i style="width:${x.c/recs[0].c*100}%;background:var(--blue)"></i></div></div><span class="u">${x.c} reco${x.c>1?"s":""}</span></div>`).join(""):'<div class="none">Ajoute tes recrues dans Équipe, ou note qui t\'a recommandé chaque contact.</div>'}</div></div>
    <div class="w s12" style="grid-column:span 12"><div class="w-h"><div><h3>Activité récente</h3><div class="sub">Derniers changements d'étape</div></div></div>
      <div class="w-b feed"><div class="items">${feed.length?feed.slice(0,6).map(f=>`<div class="it" tabindex="0" data-open="${esc(f.p.id)}"><span class="ico" style="${stv(f.h.s)}">${svgI("check")}</span><span class="t">${esc(f.p.nom)}<small>passé en ${esc(S[f.h.s]?.l||f.h.s)}</small></span><span class="when">${rel(f.h.d)}</span></div>`).join(""):'<div class="none">Tes changements d\'étape apparaîtront ici.</div>'}</div></div></div>
  </div>`;
}
document.addEventListener("click",e=>{if(e.target.closest("[data-backnow]"))$("mNow").click()});
$("v-dash").addEventListener("click",e=>{
  const stb=e.target.closest("[data-start]");if(stb){markStarted(P.find(p=>p.id===stb.dataset.start));return}
  const o=e.target.closest("[data-open]");if(o)return openContact(P.find(p=>p.id===o.dataset.open));
  const t=e.target.closest("[data-team]");if(t)return openTeam(T.find(x=>x.id===t.dataset.team));

// ---------- prospects ----------
const stSelect=r=>`<select class="st" style="${stv(r.statut)}" aria-label="Statut de ${esc(r.nom)}" ${canWrite?"":"disabled"}>${STATUTS.filter(s=>s.k!=="valide"||r.statut==="valide").map(s=>`<option value="${s.k}" ${s.k===r.statut?"selected":""}>${s.l}</option>`).join("")}</select>`;
function nextAction(r){
  if(r.statut==="relance"&&r.dateRelance){const n=daysFrom(r.dateRelance);return `<span class="when ${n<0?"late":n===0?"today":""}">Relance ${rel(r.dateRelance)}</span>`}
  if(r.statut==="relance")return `<span class="when late">Relance sans date</span>`;
  if((r.statut==="rdv_cale"||r.statut==="rdv_fait")&&r.dateRdv)return `<span class="when rdv">RDV ${dmy(r.dateRdv)}</span>`;
  return `<span class="m">—</span>`;
}
function renderPros(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  const cnt={};P.forEach(r=>cnt[r.statut]=(cnt[r.statut]||0)+1);
  const vs=STATUTS.filter(s=>s.k!=="valide"||cnt.valide);
  $("filters").hidden=mode==="pipe";
  $("filters").innerHTML=`<button type="button" class="fchip" aria-pressed="${!filt}" data-k="">Tous <b>${P.length}</b></button>`+vs.map(s=>`<button type="button" class="fchip" style="${stv(s.k)}" data-k="${s.k}" aria-pressed="${filt===s.k}"><span class="d"></span>${s.l} <b>${cnt[s.k]||0}</b></button>`).join("");
  const sel=$("fListeSel"),cur=sel.value;sel.innerHTML='<option value="">Toutes les listes</option>'+listes().map(l=>`<option ${l===cur?"selected":""}>${esc(l)}</option>`).join("");
  sel.hidden=listes().length<2;if(sel.hidden)sel.value="";
  $("tri").hidden=mode==="pipe";
  const lo=$("tri").querySelector('[value="liste"]');if(lo)lo.hidden=listes().length<2;
  if(!loaded){$("prosBody").innerHTML='<div class="empty">Chargement…</div>';return}
  const q=norm($("q").value),li=sel.value,tri=$("tri").value;
  const base=P.filter(r=>(!li||r.liste===li)&&(!q||norm([r.nom,r.tel,r.note,r.recommandation,r.liste].join(" ")).includes(q)));
  if(mode==="pipe")return renderBoard(base);
  const v=base.filter(r=>!filt||r.statut===filt);
  if(!v.length){$("prosBody").innerHTML=`<div class="table"><div class="empty"><b>${P.length?"Aucun contact ne correspond":"Aucun contact"}</b>${P.length?"Essaie un autre filtre ou une autre recherche.":"Ajoute ton premier contact."}</div></div>`;return}
  let groups;
  if(tri==="nom")groups=[[null,[...v].sort((a,b)=>a.nom.localeCompare(b.nom,"fr"))]];
  else if(tri==="maj")groups=[[null,[...v].sort((a,b)=>String(b.maj||"").localeCompare(String(a.maj||""))||b.ordre-a.ordre)]];
  else if(tri==="relance")groups=[[{l:"À relancer",v:"rel"},v.filter(r=>r.statut==="relance").sort(relanceSort)],[{l:"Les autres",v:"todo"},v.filter(r=>r.statut!=="relance").sort((a,b)=>a.ordre-b.ordre)]];

  else groups=STATUTS.map(s=>[s,v.filter(r=>r.statut===s.k).sort(s.k==="relance"?relanceSort:(a,b)=>a.ordre-b.ordre)]);

async function setStatus(p,k,withUndo){
  if(!p||p.statut===k)return;
  const prev={statut:p.statut,historique:Array.isArray(p.historique)?p.historique:[],dateSignature:p.dateSignature??null,moisUnites:p.moisUnites??null,dateRelance:p.dateRelance??null};
  const patch={statut:k,maj:today(),historique:histPush(p,k)};
  if(k==="signe"&&!p.dateSignature)patch.dateSignature=today();
  if(k==="signe"&&!p.moisUnites)patch.moisUnites=ym(p.dateSignature||today());
  if(k==="relance"&&!p.dateRelance)patch.dateRelance=addDays(3);
  try{await db.doc(PROS+"/"+p.id).update(patch);
    if(withUndo)toast(`${p.nom} · ${S[k].l}${patch.dateRelance?" (relance dans 3 j)":""}`,async()=>{try{await db.doc(PROS+"/"+p.id).update({...prev,maj:today()});toast("Modification annulée")}catch(err){fail(err)}});
    if(k==="signe"&&!(Number(p.unites)>0))setTimeout(()=>openContact(P.find(x=>x.id===p.id)||{...p,...patch},null,"Contrat signé : indique le nombre d'unités."),200);
  }catch(err){fail(err)}
}

  if(uc>seuil){o.line(`${pre} · fonds euros ${eu} % × ${t1}`,m*pc(eu)*num(t1)/100*0.24/10);o.line(`${pre} · UC ${uc} % × ${t2}`,m*pc(uc)*num(t2)/100*0.24/10)}
  else o.line(`${pre} · UC ${uc} % × ${t3} (UC ≤ ${seuil} %)`,m*pc(uc)*num(t3)/100*0.24/10)};

     o.line(`VL · UC ${v.vuc} % × (frais + 3,25 %)`,v.vl*pc(v.vuc)*(pc(v.vf)+0.0325)/10);o.line(`VL · fonds euros ${100-v.vuc} % × frais`,v.vl*pc(100-v.vuc)*pc(v.vf)/10);

  {k:"abav",g:"Abeille",l:"Assurance vie",d:"Abeille Épargne Active",
