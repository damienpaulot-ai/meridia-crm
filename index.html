      <button class="btn ghost" type="button" data-cnew ${ok&&canWrite?"":"disabled"}>Nouveau client avec ces unités</button></div>`}
    <div class="cdisc">Estimation d'après ton fichier de calcul (version du 06/02/2024). En cas de doute, la centrale fait foi.</div>
  </div>`}
function mountCalc(el,opt){const compact=!!opt.compact;
  const paintRes=()=>{const p=calcCur(),r=calcRun(p),box=el.querySelector("[data-res]");if(!box)return;box.innerHTML=calcRes(p,r,compact);const mini=el.querySelector("[data-mini]");if(mini)mini.textContent=fmt1(r.total)+" u"};
  const paint=()=>{const p=calcCur(),vals=calcVals(p);
    const picker=compact?`<div class="cf"><span class="cl">Produit</span><select data-cprod>${GROUPS.map(g=>`<optgroup label="${g}">${CALC.filter(x=>x.g===g).map(x=>`<option value="${x.k}"${x.k===p.k?" selected":""}>${esc(prodLabel(x))}</option>`).join("")}</optgroup>`).join("")}</select></div>`
      :`<div class="cprods">${GROUPS.map(g=>`<div class="cgrp"><span>${g}</span><div class="pchips">${CALC.filter(x=>x.g===g).map(x=>`<button type="button" class="fchip" data-cp="${x.k}" aria-pressed="${x.k===p.k}">${esc(x.l)}</button>`).join("")}</div></div>`).join("")}</div>`;
    const secs=p.sec.map(s=>`<div class="csec"><h4>${esc(s.t)}</h4><div class="cgrid">${s.f.map(f=>calcField(f,vals)).join("")}</div></div>`).join("");
    el.innerHTML=compact?`${picker}${secs}<div class="cres-c" data-res></div>`
      :`${picker}<div class="cbody"><div class="w cform"><div class="w-h chead"><div><h3>${esc(prodLabel(p))}</h3><span class="sub">${esc(p.d)}</span></div><b class="cmini" data-mini></b></div><div class="w-b">${secs}</div></div><div class="w cres" data-res></div></div>`;
    paintRes()};
  el.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;calcVals(calcCur())[f]=e.target.value;calcSave();
    const h=el.querySelector(`[data-h="${f}"]`),fd=calcCur().sec.flatMap(s=>s.f).find(x=>x.k===f);if(h&&fd?.split)h.textContent=euHint(e.target.value);paintRes()});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.f){e.preventDefault();e.target.blur()}});
  el.addEventListener("change",e=>{if(e.target.matches("[data-cprod]")){CST.prod=e.target.value;calcSave();paint()}if(e.target.matches("[data-ctarget]"))CTARGET=e.target.value});
  el.addEventListener("click",e=>{
    const cp=e.target.closest("[data-cp]");if(cp){CST.prod=cp.dataset.cp;calcSave();paint();return}
    const tg=e.target.closest("[data-tg]");if(tg){calcVals(calcCur())[tg.dataset.tg]=Number(tg.dataset.x);calcSave();tg.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===tg));paintRes();return}
    if(e.target.closest("[data-creset]")){delete CST.v[CST.prod];calcSave();paint();return}
    const p=calcCur(),r=calcRun(p),pre={unites:r1(r.total),produit:prodLabel(p)};
    if(e.target.closest("[data-cuse]")&&opt.onUse)opt.onUse(pre);
    if(e.target.closest("[data-cnew]"))openContact(null,"signe",null,pre);
    if(e.target.closest("[data-capply]")){const row=P.find(x=>x.id===CTARGET);if(!row){const s=el.querySelector("[data-ctarget]");s.focus();toast("Choisis d'abord un contact.");return}openContact(row,"signe",null,pre)}
  });
  paint();return {paint,paintRes}}
let calcUI=null;
function renderCalc(){if(!calcUI)calcUI=mountCalc($("v-calc"),{});else calcUI.paintRes()}

// ---------- assistant RDV ----------
const KB=[{"t": "Bienvenue : comment utiliser cet espace", "c": "Démarrer", "d": "Par où commencer et comment lire les fiches.", "x": "Cet espace regroupe ce qu'il te faut pour tes premiers rendez-vous Meridia : le déroulé du RDV, les phrases clés, les réponses aux objections et le calculateur d'unités.\n# Par où commencer\n- Lis d'abord les ressources épinglées.\n- Apprends ensuite le process de vente étape par étape.\n- Révise les objections avant chaque rendez-vous.\n- Utilise l'onglet « Calculateur d'unités » pour estimer un contrat.\n# Comment lire une fiche\n> Les encadrés bleus, ce sont les phrases à dire au client.\n< Les lignes en italique, c'est ce que le client répond en général.\n! Les lignes orange, ce sont les indications pour toi.\nQuand tu as lu une ressource, clique sur « J'ai lu » : ta progression s'affiche en haut de la bibliothèque."}, {"t": "La règle d'or du rendez-vous", "c": "Démarrer", "d": "« Je te propose de… », puis « ça te va ? ».", "x": "Chaque étape du rendez-vous s'ouvre par **« Je te propose de… »** et se ferme par **« ça te va ? »**.\nLe client garde la main : il valide chaque étape, il ne se sent jamais forcé. Et toi, tu gardes le contrôle du déroulé.\n# Exemples\n> Je te propose qu'on se bloque 45 minutes, jeudi à 18 h, pour faire le point sur ta situation et tes projets. Ça te va ?\n> Je te propose de te présenter rapidement le cabinet. Ça te va ?\n> Je te propose qu'on regarde ce que ça donnerait avec ta situation à toi. Ça te va ?"}, {"t": "Les 11 étapes du rendez-vous", "c": "Process de vente", "d": "Le déroulé complet, dans l'ordre.", "x": "- **1. Préparer le RDV** : confirmer la veille, savoir où on va.\n- **2. Le quart d'heure d'or** : briser la glace, 10 à 15 minutes, sans parler finances.\n- **3. Présenter Meridia** : les chiffres du cabinet, sans vendre.\n- **4. La prise de conscience** : ni lui ni son banquier ne gèrent vraiment son argent.\n- **5. L'ACS** : Avis, Conseil, Suivi, et la recommandation comme contrepartie.\n- **6. Banque contre Meridia** : un vendeur ou un planificateur ?\n- **7. La partie patrimoine** : la gestion de patrimoine accessible à tous.\n- **8. La retraite** : 3 cotisants pour 1 retraité hier, 1,3 demain.\n- **9. L'entonnoir et la phrase bleue** : le temps est un allié quand on commence tôt.\n- **10. Le tableau blanc** : court, moyen et long terme, et le bateau.\n- **11. Conclure** : le deuxième rendez-vous et les recommandations.\n! Passe à l'étape suivante seulement quand le client a validé la précédente."}, {"t": "Préparer le rendez-vous", "c": "Process de vente", "d": "Le message de confirmation et ce qu'il faut avoir avec soi.", "x": "# Au moment de fixer le rendez-vous\n> Je te propose qu'on se bloque 45 minutes, [jour] à [heure], pour faire le point sur ta situation et tes projets. Ça te va ?\n# La veille, par message\n> Salut [prénom], c'est [ton prénom] de Meridia. Je te confirme notre rendez-vous demain à [heure]. À demain !\n# À ne pas oublier\n- La Base imprimée, un stylo et une feuille blanche pour le tableau.\n- Ce que tu sais déjà : qui t'a recommandé, son âge, son métier.\n- Être à l'heure, tenue soignée, téléphone en silencieux. La confiance commence avant de parler."}, {"t": "Le quart d'heure d'or", "c": "Process de vente", "d": "Créer une vraie connexion avant de parler argent.", "x": "Le but : casser la distance et montrer que tu t'intéresses à la personne avant la technique.\n> Avant de commencer, je te propose qu'on prenne quelques minutes pour faire connaissance, et ensuite je t'explique comment va se passer le rendez-vous. Ça te va ?\n> Moi, c'est [ton prénom]. [Deux phrases sur ton parcours et une anecdote perso.]\n! Ensuite, ses quatre sujets : travail, famille, logement, projets.\n> Et toi, tu fais quoi dans la vie actuellement ? Tu aimes ce que tu fais ?\n> Tu es installé ici depuis longtemps ? Tu es plutôt ville ou campagne ?\n> Tu vis seul, en couple, avec des enfants ?\n> Tu as des projets en tête en ce moment, pro, perso, voyages ?\n! Écoute, relance, reformule. Note ses projets : tu les replaceras dans le tableau blanc.\nGarde le « tu » seulement si le client est à l'aise. Sinon, reste au « vous »."}, {"t": "La prise de conscience", "c": "Process de vente", "d": "Qu'il réalise lui-même que son argent n'est pas géré.", "x": "Sans accuser, sans juger : tu décris une réalité, tu ne critiques jamais ses choix.\n> Aujourd'hui, tu travailles pour faire un métier qui te plaît et pour gagner de l'argent, c'est bien ça ?\n< Oui, comme tout le monde.\n> Est-ce que c'est important pour toi de bien gérer ton argent pour réaliser tes projets ?\n< C'est évident.\n> Mais est-ce que c'est simple pour toi de bien investir, de préparer ton avenir, de trouver des solutions adaptées à tes projets ?\n! S'il dit oui : demande-lui comment il fait. Souvent, c'est un tableau Excel ou un livret.\n> Si demain ta voiture tombe en panne, tu préfères la réparer toi-même ou appeler un expert ?\n! S'il dit non :\n> On est d'accord, en France il y a très peu d'informations pour bien gérer son argent. Mais rassure-moi, ton banquier t'aide au quotidien ? Il te conseille ?\n< Je ne sais même pas qui c'est.\n> Est-ce que tu es contre le fait d'avoir des informations pour mieux gérer ton argent et atteindre tes projets ?\n< Non, bien sûr que non.\n> Parfait, c'est exactement ce que je fais. Il existe plus de 600 acteurs en assurance et en épargne. Moi, je les compare pour toi. Est-ce que tu trouves que ça a du sens ?\n! Passe à la suite seulement quand il a compris que ni lui ni son banquier ne gèrent au mieux son argent."}, {"t": "L'ACS : Avis, Conseil, Suivi", "c": "Process de vente", "d": "Annoncer le déroulé et poser la recommandation dès le début.", "x": "> Je te propose qu'on fonctionne en trois temps.\n> **A comme Avis.** Le but de ce rendez-vous est simplement d'avoir ton avis sur mon métier. Pas de décision, pas d'engagement.\n> **C comme Conseil.** Si ce que je fais te parle, on pourra passer à une partie conseil. Uniquement si tu en as envie.\n> **S comme Suivi.** D'après toi, c'est important d'être bien suivi dans ses finances ?\n< Oui.\n> Tu sais combien coûte un conseiller financier en France, en moyenne ? Environ 150 € de l'heure. Tu serais prêt à payer ça ?\n< Non.\n> Chez Meridia, on fonctionne par recommandation, ce qui nous permet de ne pas facturer ce type de tarif. Si tu es satisfait du travail qu'on fait ensemble, tu trouverais ça juste de me recommander autour de toi ?\n< Oui.\n! C'est ici qu'il accepte, dès le début, l'idée de te recommander."}, {"t": "Banque contre Meridia", "c": "Process de vente", "d": "Vendeur salarié ou planificateur qui compare ?", "x": "> Dis-moi franchement : tu vois souvent ton banquier ?\n< Rarement.\n> Et quand tu le vois, il te parle de tes projets… ou de ses produits ?\n< De ses produits.\n> Normal. Ton banquier est un vendeur salarié, payé pour placer les produits de sa banque, que ça te corresponde ou pas.\n> Imagine : tu vas chez un concessionnaire Renault et tu lui demandes si Peugeot ou BMW sont mieux. Il va te répondre quoi ?\n> La banque vend ce qu'elle a, pas ce dont tu as besoin. Nous, on n'est pas une banque : on compare pour toi, dans ton intérêt, et on te suit vraiment.\n> Si tu avais le choix entre un vendeur qui te propose 3 produits et un planificateur qui compare 600 solutions pour toi, tu préfères travailler avec qui ?\n! Ton calme et posé. Glisse une anecdote perso sur ta propre banque, sans attaquer."}, {"t": "Le tableau blanc", "c": "Process de vente", "d": "Court, moyen, long terme : lui faire voir ses deux problèmes.", "x": "> Je te propose qu'on regarde comment fonctionne une stratégie équilibrée. Je dessine trois colonnes : court terme, moyen terme, long terme.\n! Moins de 5 ans, 5 à 10 ans, plus de 10 ans.\n> Tu gagnes combien à peu près par mois ? Et sur ça, tu arrives à mettre combien de côté ? Tu la places où, cette épargne ?\n! Tu écris son placement (souvent le Livret A) dans la colonne court terme. Les deux autres restent vides.\n# Problème 1 : le bateau\n> Sur le moyen et le long terme, il n'y a rien de préparé. C'est comme un bateau avec tout le poids à l'avant : il avance mal et n'arrive jamais vraiment à destination.\n# Problème 2 : l'inflation\n> Il y a 10 ans, on achetait un kebab à 5 €. Aujourd'hui, avec 5 €, tu as la boisson et les frites. Ton billet vaut toujours 5 €, mais tu n'achètes plus la même chose.\n> Ton épargne fait des dents de scie : tu économises, tu fais un projet, ça redescend, tu recommences.\n> Mon rôle, ce n'est pas de te faire épargner plus, c'est de repositionner ce que tu fais déjà pour que ton bateau avance droit.\n! Vérifie les taux du jour (Livret A, inflation) avant ton rendez-vous."}, {"t": "Conclure", "c": "Process de vente", "d": "Obtenir le deuxième rendez-vous et des recommandations.", "x": "> Tu souhaites continuer à tout mettre sur le court terme, comme la majorité des Français, ou répartir intelligemment ta capacité d'épargne pour que chaque euro travaille enfin pour toi ?\n> Tu n'as pas besoin d'épargner plus. Tu as juste besoin d'épargner mieux, dès maintenant.\n> Je te propose de faire une analyse détaillée pour voir comment tu fonctionnes. Ça te va ?\n! Agenda ouvert : tu fixes la date tout de suite.\n> Et comme on l'a dit tout à l'heure, je te propose de me donner deux ou trois personnes autour de toi à qui ça pourrait servir.\n! Demande des recommandations même s'il ne signe pas : il les a déjà acceptées à l'ACS."}, {"t": "« Je cotise déjà »", "c": "Objections", "d": "Moment du RDV : retraite.", "x": "! Quand elle tombe : partie retraite.\n> Bien sûr, et c'est indispensable. Mais tes cotisations financent la retraite des autres, pas la tienne. Elles te donnent des droits, pas forcément un revenu suffisant. Je ne remplace pas le système, j'ajoute une stratégie pour sécuriser ta retraite à toi.\n! Ne te justifie pas : reformule, réponds, puis repose ta question."}, {"t": "« Je verrai plus tard, c'est loin »", "c": "Objections", "d": "Moment du RDV : retraite.", "x": "! Quand elle tombe : partie retraite.\n> Bien sûr. Mais plus on attend, plus l'effort devient lourd, et personne n'a envie de courir derrière sa retraite à 55 ans. Même un petit montant maintenant a plus d'impact que ce que tu feras dans 10 ou 15 ans. Je ne te demande pas d'y consacrer ta vie, juste de poser les premières pierres pendant que le temps travaille pour toi.\n! Ne te justifie pas : reformule, réponds, puis repose ta question."}, {"t": "« Je ne sais même pas combien je vais toucher »", "c": "Objections", "d": "Moment du RDV : retraite.", "x": "! Quand elle tombe : partie retraite.\n> C'est normal, et c'est justement pour ça qu'il faut anticiper. On sait trois choses : tu toucheras moins que ton revenu actuel, le système s'affaiblit, et ton niveau de vie dépendra de ce que tu prépares toi-même. Tu n'as pas besoin du montant exact, juste de savoir que tu ne veux pas subir.\n! Ne te justifie pas : reformule, réponds, puis repose ta question."}, {"t": "« Je ne peux pas mettre de côté maintenant »", "c": "Objections", "d": "Moment du RDV : retraite.", "x": "! Quand elle tombe : partie retraite.\n> Je comprends. L'idée n'est pas un effort énorme, mais un effort intelligent. Même un montant modeste, régulier et bien placé, peut changer ta retraite. C'est comme construire une maison : on pose une brique à la fois.\n! Ne te justifie pas : reformule, réponds, puis repose ta question."}, {"t": "« Je mets déjà sur le Livret A »", "c": "Objections", "d": "Moment du RDV : tableau blanc.", "x": "! Quand elle tombe : partie tableau blanc.\n> Et c'est une très bonne chose, on en a besoin. Mais le Livret A n'a qu'un rôle : la sécurité, pas la croissance. Utiliser un outil de sécurité pour un objectif de croissance, c'est comme faire un Paris–Nice avec une voiture de ville. Ça roule, mais ce n'est pas fait pour ça.\n! Ne te justifie pas : reformule, réponds, puis repose ta question."}, {"t": "« Je verrai plus tard »", "c": "Objections", "d": "Moment du RDV : tableau blanc.", "x": "! Quand elle tombe : partie tableau blanc.\n> Je comprends. Mais le but n'est pas de faire plus plus tard, c'est de faire mieux maintenant. Si tu attends, tu devras mettre plus, plus vite, avec moins de résultats. Je ne te demande pas de changer ton effort, juste de le replacer au bon endroit.\n! Ne te justifie pas : reformule, réponds, puis repose ta question."}, {"t": "Calculer les unités d'un contrat", "c": "Produits", "d": "Les produits disponibles et les points de vigilance.", "x": "L'onglet **Calculateur d'unités**, en haut de cette page, reprend le fichier de calcul Meridia (version du 06/02/2024).\n# Produits disponibles\n- **SEP** : REP (avec ou sans garantie protection plus), SOP V3, SOP V4, PER, Trevolia.\n- **MMA** : MMA Actif, PER Expert, Swiss Life Retraite.\n- **Abeille** : Assurance vie (Épargne Active), PER IN.\n# Points de vigilance\n- REP : le calcul s'arrête aux 62 ans du client. Au-delà de 41 ans, fais confirmer par la centrale.\n- Pas de commission sur les versements libres à la souscription (REP).\n- Abeille PER IN : après 57 ans, la surco baisse de 20 % par année.\n- En cas de chute ou d'arrêt des versements, des reprises s'appliquent.\n! C'est une estimation : en cas de doute, la centrale fait foi."}, {"t": "Process de vente complet", "c": "Outils", "d": "La carte mentale, le script mot à mot et le tableau blanc interactif.", "x": "La page complète du rendez-vous : la carte mentale des 11 étapes, le script mot à mot avec toutes les objections, et le tableau blanc à apprendre dans l'ordre."}, {"t": "Les taux du moment", "c": "Repères", "d": "Livrets, PEL, fonds euros, inflation : les chiffres à connaître avant un RDV.", "x": "Chiffres relevés le 5 novembre 2026. Les taux des livrets réglementés sont révisés le 1er février et le 1er août : vérifie-les avant tes rendez-vous.\n# Livrets réglementés (nets d'impôts)\n- **Livret A** : 1,7 % depuis le 1er août 2026, plafond 22 950 €.\n- **LDDS** : 1,7 %, plafond 12 000 €.\n- **LEP** : 2,5 %, plafond 10 000 €, sous conditions de revenus.\n- **Livret Jeune** : au moins 1,7 % (jamais sous le Livret A), plafond 1 600 €.\n# Épargne logement\n- **CEL** : 1,25 % brut.\n- **PEL ouvert aujourd'hui** : 2 % brut, garanti pendant toute la durée du plan.\n# Autres placements\n- **Fonds euros d'assurance vie** : 2,63 % en moyenne servis pour 2025 (ACPR), avant prélèvements sociaux. Certains contrats dépassent 3,5 %.\n- **Livrets bancaires classiques** : 0,81 % brut en moyenne (Banque de France).\n- **SCPI** : 4,91 % de taux de distribution moyen en 2025 (ASPIM).\n# Inflation\n- **3,4 % sur un an** en octobre 2026 (estimation provisoire de l'Insee).\n! Un placement qui rapporte moins que l'inflation fait perdre du pouvoir d'achat, même s'il affiche un taux positif."}, {"t": "Quel placement pour quel horizon ?", "c": "Repères", "d": "Court, moyen, long terme : à quoi sert chaque produit.", "x": "Chaque placement a un rôle. L'erreur la plus fréquente : tout mettre au même endroit, souvent sur le Livret A.\n# Court terme (moins de 5 ans)\nÉpargne de précaution et petits projets. L'argent doit rester disponible et sans risque.\n- Livret A, LDDS, LEP, Livret Jeune, compte courant.\n- Repère courant : garder **3 à 6 mois de dépenses** de côté pour les imprévus.\n# Moyen terme (5 à 10 ans)\nAchat immobilier, voiture, travaux, mariage, études des enfants.\n- Assurance vie (fonds euros et unités de compte), PEL, PEA.\n# Long terme (plus de 10 ans)\nRetraite, transmission, liberté financière. Le temps permet d'accepter plus de fluctuations pour viser plus de rendement.\n- Assurance vie, PER, PEA, SCPI.\n> Mon rôle, ce n'est pas de te faire épargner plus, c'est de mettre chaque euro au bon endroit selon le moment où tu en auras besoin."}, {"t": "Inflation et rendement réel", "c": "Repères", "d": "Pourquoi un placement « sans risque » peut faire perdre de l'argent.", "x": "**L'inflation**, c'est la hausse générale des prix. Quand elle monte, chaque euro achète moins de choses.\n**Le rendement réel**, c'est le rendement du placement moins l'inflation.\n# Exemple\n- Ton Livret A rapporte 1,7 %.\n- L'inflation est à 3,4 % sur un an.\n- Rendement réel : 1,7 − 3,4 = **−1,7 %**. Tes 1 000 € valent environ 983 € en pouvoir d'achat au bout d'un an.\n# Comment l'expliquer\n> Il y a 10 ans, on avait un kebab à 5 €. Aujourd'hui, avec 5 €, tu as la boisson et les frites. Ton billet vaut toujours 5 €, mais il achète moins.\n# Ce qu'il faut retenir\n- Le Livret A protège le capital, pas le pouvoir d'achat.\n- Sur le long terme, seuls des supports plus dynamiques (unités de compte, actions, immobilier) ont historiquement battu l'inflation, avec en contrepartie des fluctuations.\n! Ne promets jamais de rendement : les performances passées ne préjugent pas des performances futures."}, {"t": "Les intérêts composés", "c": "Repères", "d": "Pourquoi commencer tôt change tout.", "x": "**Les intérêts composés**, ce sont les intérêts qui produisent eux-mêmes des intérêts. Chaque année, le rendement s'applique au capital de départ **et** aux gains déjà accumulés.\n# Exemple (rendement estimé, non garanti)\n- 75 € par mois, de 25 à 65 ans, soit environ 36 000 € versés.\n- À 5 % par an estimés, le capital peut dépasser 100 000 € à 65 ans.\n- La différence vient des intérêts composés et du temps.\n# L'entonnoir\nPlus on commence tard, plus il faut verser chaque mois pour arriver au même capital. Le temps est le principal allié de l'épargnant.\n> Je ne te demande pas de mettre beaucoup. Je te demande de commencer maintenant, pendant que le temps travaille pour toi.\n! Toujours préciser que le rendement est une estimation et qu'il n'est pas garanti."}, {"t": "Lexique de l'épargne", "c": "Repères", "d": "Les mots à maîtriser : UC, fonds euros, PFU, TMI, arbitrage…", "x": "- **Fonds euros** : support d'assurance vie à capital garanti par l'assureur. Rendement fixé chaque année.\n- **Unités de compte (UC)** : supports investis sur les marchés (actions, obligations, immobilier). Pas de garantie en capital.\n- **Arbitrage** : déplacer de l'argent d'un support à un autre dans le même contrat.\n- **Rachat** : retrait d'argent d'une assurance vie. Il peut être partiel ou total.\n- **Versement programmé (VP)** : versement automatique chaque mois.\n- **Versement libre (VL)** : versement ponctuel, du montant que l'on veut.\n- **Clause bénéficiaire** : désigne qui recevra le capital de l'assurance vie au décès.\n- **PFU ou flat tax** : impôt forfaitaire sur les gains (12,8 % d'impôt + prélèvements sociaux).\n- **Prélèvements sociaux (PS)** : CSG, CRDS… 17,2 % sur l'assurance vie, 18,6 % sur la plupart des autres placements depuis 2026.\n- **TMI** : tranche marginale d'imposition, le taux d'impôt appliqué au dernier euro gagné (0, 11, 30, 41 ou 45 %).\n- **Gestion libre** : le client choisit ses supports.\n- **Gestion pilotée** : un professionnel gère la répartition selon un profil de risque.\n- **SRI** : indicateur de risque d'un support, de 1 (faible) à 7 (élevé).\n- **Frais sur versement / frais de gestion** : frais prélevés à l'entrée ou chaque année sur l'encours."}, {"t": "Livret A", "c": "Livrets et épargne", "d": "Le placement préféré des Français : simple, sûr, mais peu rémunéré.", "x": "# Principe\nLivret d'épargne réglementé par l'État, disponible dans toutes les banques. Un seul par personne.\n# Chiffres clés\n- **Taux** : 1,7 % depuis le 1er août 2026, fixé par l'État.\n- **Plafond** : 22 950 € de versements (les intérêts peuvent faire dépasser ce montant).\n- **Fiscalité** : intérêts exonérés d'impôt et de prélèvements sociaux.\n- **Disponibilité** : retraits à tout moment, sans frais.\n# Points forts\n- Capital garanti, argent disponible immédiatement.\n- Idéal pour l'épargne de précaution.\n# Limites\n- Rendement souvent inférieur à l'inflation : perte de pouvoir d'achat.\n- Plafond vite atteint.\n> Le Livret A, c'est parfait pour ton épargne de sécurité. Mais ce n'est pas fait pour construire ta retraite ou faire grossir ton argent sur 10 ans."}, {"t": "LDDS", "c": "Livrets et épargne", "d": "Le « petit frère » du Livret A.", "x": "# Principe\nLivret de développement durable et solidaire. Mêmes règles que le Livret A, avec un plafond plus bas. Un seul par personne majeure.\n# Chiffres clés\n- **Taux** : 1,7 %, identique au Livret A.\n- **Plafond** : 12 000 €.\n- **Fiscalité** : exonéré d'impôt et de prélèvements sociaux.\n- **Disponibilité** : immédiate.\n# À retenir\nAvec un Livret A et un LDDS pleins, on a près de 35 000 € d'épargne de précaution défiscalisée. Au-delà, l'argent dort."}, {"t": "LEP", "c": "Livrets et épargne", "d": "Le livret le mieux rémunéré, réservé aux revenus modestes.", "x": "# Principe\nLivret d'épargne populaire, réservé aux personnes dont les revenus ne dépassent pas un plafond.\n# Chiffres clés\n- **Taux** : 2,5 % net.\n- **Plafond** : 10 000 €.\n- **Condition 2026** : revenu fiscal de référence inférieur ou égal à 23 028 € pour une personne seule (le seuil augmente avec le nombre de parts).\n- **Fiscalité** : exonéré d'impôt et de prélèvements sociaux.\n# À retenir\nSi ton client y a droit, c'est le premier livret à remplir. Beaucoup de jeunes actifs et d'étudiants sont éligibles sans le savoir.\n! Les seuils de revenus sont mis à jour chaque année : vérifie sur service-public.fr."}, {"t": "Livret Jeune", "c": "Livrets et épargne", "d": "Pour les 12-25 ans, au moins aussi rémunéré que le Livret A.", "x": "# Principe\nLivret réservé aux 12-25 ans. Il est clôturé au plus tard le 31 décembre de l'année des 25 ans. Un seul par personne.\n# Chiffres clés\n- **Taux** : au minimum celui du Livret A (1,7 %). Chaque banque peut proposer plus : de 1,7 % à 3,75 % selon les établissements.\n- **Plafond** : 1 600 €.\n- **Fiscalité** : exonéré d'impôt et de prélèvements sociaux.\n# À retenir\nBon point de départ pour un jeune, mais le plafond est très bas. Pour un jeune actif, l'enjeu est surtout de commencer une épargne long terme tôt."}, {"t": "PEL et CEL", "c": "Livrets et épargne", "d": "L'épargne logement : épargner pour un projet immobilier.", "x": "# Le PEL (plan d'épargne logement)\n- **Taux** : 2 % brut pour un PEL ouvert aujourd'hui, garanti pendant toute la durée du plan.\n- **Fonctionnement** : versements réguliers obligatoires (540 € par an minimum), durée de 4 à 10 ans.\n- **Plafond** : 61 200 €.\n- **Fiscalité** : intérêts imposés au prélèvement forfaitaire dès le premier euro pour les plans ouverts depuis 2018.\n- **Retrait** : retirer l'argent ferme le plan. Avant 2 ans, les intérêts sont fortement réduits.\n# Le CEL (compte épargne logement)\n- **Taux** : 1,25 % brut.\n- **Plafond** : 15 300 €.\n- **Disponibilité** : retraits libres, comme un livret.\n# À retenir\n- Le PEL bloque l'argent et rapporte peu une fois les impôts payés.\n- Les anciens PEL ouverts avant 2011 peuvent avoir des taux très intéressants (jusqu'à 4 % ou plus) : ton client doit souvent les **garder**.\n! Les taux et règles fiscales des anciens plans dépendent de leur date d'ouverture."}, {"t": "Livrets bancaires et super-livrets", "c": "Livrets et épargne", "d": "Les livrets « maison » des banques : fiscalisés et souvent peu rémunérés.", "x": "# Principe\nLivrets proposés librement par chaque banque, sans plafond réglementé.\n# Chiffres clés\n- **Taux moyen** : 0,81 % brut (Banque de France). 0,34 % dans les grandes banques. Les super-livrets offrent en moyenne 1,77 % brut hors promotions.\n- **Fiscalité** : intérêts soumis à la flat tax de 31,4 % (12,8 % d'impôt + 18,6 % de prélèvements sociaux) depuis 2026.\n# À retenir\n- Les taux « boostés » ne durent souvent que 2 ou 3 mois.\n- Une fois les impôts payés, ils rapportent généralement moins qu'un Livret A.\n> Ton livret à 2 %, c'est un taux d'appel. Après 3 mois, il retombe, et en plus il est imposé."}, {"t": "L'assurance vie : le principe", "c": "Assurance vie", "d": "Le placement le plus complet : épargner, faire fructifier, transmettre.", "x": "# Principe\nContrat dans lequel le client verse de l'argent quand il veut. L'assureur le place sur différents supports. Malgré son nom, c'est avant tout **un placement d'épargne**, pas une assurance décès.\n# À quoi ça sert\n- **Épargner** pour un projet à moyen ou long terme.\n- **Faire fructifier** son argent avec plus de rendement qu'un livret.\n- **Préparer sa retraite** en se constituant un capital.\n- **Transmettre** à ses proches avec une fiscalité avantageuse.\n# Comment ça marche\n- Pas de plafond de versement.\n- Versements libres ou programmés, souvent dès quelques dizaines d'euros par mois.\n- L'argent reste **disponible** : on peut retirer tout ou partie à tout moment (rachat).\n- On peut ouvrir plusieurs contrats, dans plusieurs compagnies.\n# Les supports\n- **Fonds euros** : capital garanti, rendement de 2,63 % en moyenne en 2025.\n- **Unités de compte** : actions, obligations, immobilier. Plus de potentiel, mais pas de garantie.\n# Pourquoi la date d'ouverture compte\nLa fiscalité devient très avantageuse après **8 ans**. Ouvrir tôt, même avec peu, permet de « prendre date ».\n> L'assurance vie, c'est un coffre où ton argent travaille, que tu peux ouvrir quand tu veux, et qui protège tes proches si un jour il t'arrive quelque chose."}, {"t": "Fonds euros et unités de compte", "c": "Assurance vie", "d": "Sécurité ou performance : comment répartir.", "x": "# Le fonds euros\n- **Capital garanti** par l'assureur (hors frais).\n- Rendement annuel fixé par l'assureur : **2,63 %** en moyenne en 2025, plus de 3,5 % chez certains assureurs.\n- Les gains acquis chaque année sont définitivement gagnés (effet cliquet).\n# Les unités de compte (UC)\n- Investies sur les marchés : fonds actions, obligations, SCPI, ETF…\n- **Pas de garantie en capital** : la valeur monte et descend.\n- Sur le long terme, potentiel de rendement plus élevé.\n- Chaque support a un indicateur de risque de 1 à 7.\n# Comment répartir\nLa répartition dépend de l'horizon et du profil du client :\n- **Prudent** : majorité en fonds euros.\n- **Équilibré** : moitié-moitié environ.\n- **Dynamique** : majorité en UC, pour un horizon long.\n! Beaucoup d'assureurs imposent un minimum d'UC pour accéder au fonds euros.\n> Le fonds euros, c'est le moteur de sécurité. Les UC, c'est le moteur de performance. On règle le mélange selon ton projet et le temps que tu as devant toi.\n! Le profil de risque se détermine avec le questionnaire réglementaire, jamais à l'intuition."}, {"t": "Fiscalité de l'assurance vie", "c": "Assurance vie", "d": "Retraits avant et après 8 ans.", "x": "Seuls **les gains** sont imposés lors d'un retrait, jamais le capital versé. Un retrait contient une part de capital et une part de gains, au prorata.\n# Prélèvements sociaux\n- **17,2 %** sur les gains. L'assurance vie a échappé à la hausse à 18,6 % de 2026.\n- Sur le fonds euros, ils sont prélevés chaque année sur les intérêts.\n# Avant 8 ans (versements depuis le 27/09/2017)\n- **12,8 %** d'impôt (prélèvement forfaitaire), ou le barème de l'impôt si plus intéressant.\n- + 17,2 % de prélèvements sociaux, soit **30 %** au total.\n# Après 8 ans\n- **Abattement annuel** sur les gains retirés : 4 600 € pour une personne seule, 9 200 € pour un couple.\n- Au-delà : **7,5 %** d'impôt (jusqu'à 150 000 € de versements), 12,8 % au-delà.\n- + 17,2 % de prélèvements sociaux.\n# Exemple\nAprès 8 ans, une personne seule retire 10 000 € dont 3 000 € de gains : **aucun impôt sur le revenu**, seulement les prélèvements sociaux.\n> Après 8 ans, tu peux te verser un complément chaque année presque sans impôt. C'est pour ça qu'on ouvre le contrat le plus tôt possible."}, {"t": "Assurance vie et transmission", "c": "Assurance vie", "d": "Transmettre hors succession : l'atout majeur.", "x": "Au décès, le capital est versé aux **bénéficiaires** désignés dans la clause, en dehors de la succession classique.\n# Versements effectués avant 70 ans\n- **152 500 € exonérés par bénéficiaire**.\n- Au-delà : 20 % jusqu'à 700 000 €, puis 31,25 %.\n# Versements effectués après 70 ans\n- **30 500 € exonérés** au total, tous bénéficiaires confondus, sur les versements.\n- Les gains réalisés sur ces versements sont exonérés.\n- Au-delà, droits de succession classiques.\n# Cas particuliers\n- Le conjoint marié ou le partenaire de PACS est totalement exonéré.\n# La clause bénéficiaire\n- Elle désigne qui recevra le capital : conjoint, enfants, frère, ami, association…\n- Elle doit être claire, à jour, et revue à chaque changement de vie (mariage, naissance, séparation).\n> Avec une assurance vie, tu peux transmettre jusqu'à 152 500 € à chaque personne que tu choisis, sans droits de succession.\n! Les règles de transmission ont des subtilités : pour un cas complexe, fais valider par la centrale."}, {"t": "Les frais d'une assurance vie", "c": "Assurance vie", "d": "Où sont les frais et pourquoi ils comptent.", "x": "# Les principaux frais\n- **Frais sur versement** : prélevés à chaque versement, de 0 % à environ 5 %.\n- **Frais de gestion** : prélevés chaque année sur l'encours, souvent autour de 0,5 % à 1 % sur le fonds euros et un peu plus sur les UC.\n- **Frais d'arbitrage** : pour déplacer l'argent entre supports.\n- **Frais des supports** : frais propres à chaque fonds en UC.\n# Pourquoi ils comptent\nSur 20 ou 30 ans, quelques dixièmes de point de frais annuels font une vraie différence sur le capital final.\n# Comment en parler\n> Tu as accès à des contrats qu'on ne trouve pas en agence, et on regarde ensemble tous les frais pour que tu saches exactement ce que tu paies.\n! Sois toujours transparent sur les frais : c'est une obligation réglementaire et une question de confiance."}, {"t": "La retraite en France : comment ça marche", "c": "Retraite et PER", "d": "Répartition, cotisants, taux de remplacement.", "x": "# Le système par répartition\nLes cotisations des actifs d'aujourd'hui financent les pensions des retraités d'aujourd'hui. On ne cotise pas pour sa propre retraite : on acquiert des droits.\n# Le problème démographique\n- En 1970 : environ **3 cotisants** pour 1 retraité.\n- En 2020 : environ **1,7**.\n- Projection 2070 : environ **1,3**.\nOn vit plus longtemps, il y a moins de naissances et on commence à travailler plus tard.\n# Le taux de remplacement\nC'est la part de son dernier revenu que l'on touche à la retraite. Pour beaucoup de salariés, elle est nettement inférieure au salaire, et l'écart est souvent plus fort pour les cadres et les indépendants.\n# Ce que ça veut dire pour ton client\n- La pension seule risque de ne pas suffire à garder son niveau de vie.\n- Plus il prépare tôt, plus l'effort mensuel est faible.\n> Je ne remplace pas le système. J'ajoute une stratégie pour que ta retraite à toi ne dépende pas seulement de lui.\n! Pour une estimation personnalisée, le client peut consulter info-retraite.fr."}, {"t": "Le PER : le principe", "c": "Retraite et PER", "d": "Le plan d'épargne retraite et ses trois atouts.", "x": "# Principe\nLe **plan d'épargne retraite** permet de se constituer un capital ou une rente pour la retraite. L'argent est bloqué jusqu'à la retraite, sauf cas de déblocage anticipé.\n# Les 3 atouts\n- **Réduire ses impôts aujourd'hui** : les versements peuvent être déduits du revenu imposable.\n- **Préparer sa retraite** avec une épargne investie sur le long terme.\n- **Choisir à la retraite** : sortie en capital, en rente, ou un mélange.\n# Les 3 types de versements\n- Versements volontaires du titulaire.\n- Épargne salariale (intéressement, participation, abondement).\n- Cotisations obligatoires d'entreprise.\n# La gestion\nPar défaut, en **gestion pilotée à horizon** : l'épargne est plus dynamique quand la retraite est loin, puis sécurisée progressivement à l'approche de la retraite.\n# Déblocages anticipés possibles\n- Achat de la résidence principale (sauf cotisations obligatoires).\n- Décès du conjoint ou du partenaire de PACS.\n- Invalidité du titulaire, de ses enfants ou de son conjoint.\n- Surendettement, fin de droits au chômage, cessation d'activité après liquidation judiciaire.\n> Le PER, c'est de l'argent que l'État t'aide à mettre de côté pour ta retraite : chaque euro versé peut faire baisser ton impôt dès cette année."}, {"t": "Fiscalité du PER", "c": "Retraite et PER", "d": "Déduction à l'entrée, imposition à la sortie.", "x": "# À l'entrée\n- Les versements volontaires sont **déductibles du revenu imposable**.\n- **Plafond 2026 pour un salarié** : 10 % des revenus professionnels, entre 4 710 € et 37 680 €. Plus élevé pour les indépendants (jusqu'à 88 911 €).\n- Le plafond est indiqué sur l'avis d'impôt, rubrique « plafond épargne retraite ».\n- Le plafond non utilisé se reporte : **5 ans** pour les plafonds à partir de 2026 (contre 3 ans avant).\n- Depuis 2026, les versements faits **à partir de 70 ans** ne sont plus déductibles.\n# L'économie d'impôt dépend de la TMI\n- TMI 11 % : 1 000 € versés = 110 € d'impôt en moins.\n- TMI 30 % : 1 000 € versés = 300 € d'impôt en moins.\n- TMI 41 % : 1 000 € versés = 410 € d'impôt en moins.\n# À la sortie (versements déduits)\n- **Capital issu des versements** : soumis au barème de l'impôt sur le revenu.\n- **Gains** : flat tax de 31,4 % (12,8 % + 18,6 % de prélèvements sociaux).\n- **Rente** : imposée comme une pension de retraite, après abattement.\n# Pour qui\nSurtout intéressant pour les clients imposés à 30 % ou plus. Pour un client non imposable, l'avantage fiscal est nul : l'assurance vie est souvent plus adaptée.\n! Le calcul exact dépend de la situation fiscale du client : fais une simulation avant de conseiller."}, {"t": "La prévoyance : le principe", "c": "Prévoyance", "d": "Protéger ses revenus et sa famille face aux accidents de la vie.", "x": "# Principe\nLa prévoyance verse de l'argent quand un accident de la vie fait baisser les revenus : arrêt de travail, invalidité, décès. Elle complète la Sécurité sociale, qui couvre mal ces situations.\n# Les garanties\n- **Incapacité temporaire de travail** : indemnités journalières en complément de la Sécurité sociale pendant un arrêt.\n- **Invalidité** : rente ou capital si la personne ne peut plus travailler, partiellement ou totalement.\n- **Décès** : capital ou rente versé aux proches.\n- **Perte totale et irréversible d'autonomie (PTIA)** : capital versé à l'assuré lui-même.\n- **Rente éducation** : financement des études des enfants en cas de décès d'un parent.\n- **Garantie obsèques**, **dépendance** : options possibles.\n# Pourquoi c'est important\n- Les indemnités journalières de la Sécurité sociale sont limitées à environ **50 % du salaire**, avec un plafond.\n- Les **indépendants** sont souvent les moins bien couverts.\n- Une famille avec un crédit immobilier et des enfants peut être fragilisée très vite.\n# Les mots à connaître\n- **Franchise** : nombre de jours sans indemnisation au début de l'arrêt.\n- **Délai de carence** : période après la souscription pendant laquelle certaines garanties ne jouent pas encore.\n- **Questionnaire de santé** : souvent demandé à la souscription.\n> Si demain tu ne peux plus travailler pendant 6 mois, comment tu paies ton loyer et tes factures ?"}, {"t": "Prévoyance : salariés et indépendants", "c": "Prévoyance", "d": "Qui est couvert, et où sont les trous.", "x": "# Les salariés\n- La Sécurité sociale verse des indemnités journalières en cas d'arrêt, calculées sur le salaire et plafonnées.\n- L'employeur complète souvent le salaire pendant un temps, selon l'ancienneté et la convention collective.\n- Beaucoup d'entreprises ont un **contrat de prévoyance collectif** : le client doit vérifier ce qu'il couvre vraiment.\n# Les indépendants (TNS)\n- Les prestations de base sont calculées sur les revenus déclarés et restent limitées.\n- Le contrat de prévoyance individuel est souvent indispensable.\n- Les cotisations peuvent être déductibles du bénéfice (dispositif Madelin), dans certaines limites.\n# Questions à poser au client\n- Que se passe-t-il si tu es en arrêt 3 es (bureaux, commerces, santé, logistique…). Le client achète des parts et reçoit une partie des loyers.\n# Chiffres clés\n- **Taux de distribution moyen 2025** : 4,91 % (ASPIM).\n- Ticket d'entrée accessible : souvent quelques centaines d'euros la part.\n# Points forts\n- Immobilier sans gestion : pas de travaux, pas de locataire à trouver.\n- Revenus réguliers, diversification sur de nombreux immeubles.\n- Possible en direct, à crédit, ou via une assurance vie en unités de compte.\n# Risques\n- **Capital non garanti** : la valeur des parts peut baisser.\n- Revenus variables, non garantis.\n- **Liquidité limitée** : revendre ses parts peut prendre du temps (fin 2025, 2,8 milliards d'euros de parts attendaient preneur).\n- Frais d'entrée souvent élevés (8 à 12 %) : placement de long terme, 8 à 10 ans minimum.\n# Fiscalité en direct\nLes revenus sont imposés comme des revenus fonciers (barème + prélèvements sociaux). Via une assurance vie, c'est la fiscalité de l'assurance vie qui s'applique."}, {"t": "La flat tax en 2026", "c": "Fiscalité", "d": "30 % ou 31,4 % : ce qui change selon le placement.", "x": "# Le principe\nLa **flat tax** (ou PFU, prélèvement forfaitaire unique) taxe les revenus de l'épargne à un taux fixe : 12,8 % d'impôt sur le revenu + les prélèvements sociaux.\n# Ce qui a changé en 2026\nLa CSG sur les revenus du capital est passée de 9,2 % à 10,6 %. Les prélèvements sociaux montent donc de 17,2 % à **18,6 %** pour la plupart des placements.\n# Placements à 31,4 % (12,8 % + 18,6 %)\n- Compte-titres, livrets bancaires fiscalisés, comptes à terme.\n- PEA avant 5 ans.\n- Gains du PER à la sortie.\n- Épargne salariale.\n# Placements restés à 30 % (12,8 % + 17,2 %)\n- **Assurance vie** et contrats de capitalisation.\n- Revenus fonciers et plus-values immobilières (prélèvements sociaux à 17,2 %).\n# Totalement exonérés\n- Livret A, LDDS, LEP, Livret Jeune.\n> En 2026, l'assurance vie a été épargnée par la hausse des prélèvements. C'est un argument de plus pour en faire le cœur de ton épargne.\n! La fiscalité évolue avec chaque loi de finances : vérifie sur impots.gouv.fr en cas de doute."}, {"t": "Comprendre sa tranche d'imposition (TMI)", "c": "Fiscalité", "d": "La notion clé pour conseiller un PER.", "x": "# Le principe\nL'impôt sur le revenu est calculé par tranches. Chaque tranche de revenu est taxée à un taux différent : 0 %, 11 %, 30 %, 41 %, 45 %.\nLa **TMI** (tranche marginale d'imposition), c'est le taux appliqué à la dernière tranche de revenu du client.\n# Pourquoi c'est important\n- Un versement sur un PER fait économiser de l'impôt **au taux de la TMI**.\n- Un client à 30 % économise 300 € pour 1 000 € versés. À 11 %, seulement 110 €.\n# Comment la trouver\n- Sur l'avis d'impôt, ou avec le simulateur d'impots.gouv.fr.\n- Ne pas confondre avec le **taux moyen** (impôt total ÷ revenu), toujours plus bas.\n> Tu sais dans quelle tranche tu es ? Ça change complètement la stratégie qu'on va mettre en place."}];

  rows.forEach(t=>{const p=t._raw.recruteur&&ids.has(t._raw.recruteur)&&t._raw.recruteur!==t._raw.id?t._raw.recruteur:"";(KIDS[p]=KIDS[p]||[]).push(t)})}
function openAnn(t){const a=t._ann,dn=downline(t),mg=annOf(a.manager);
  openSheet(t.nom,`<div class="w" style="padding:12px 14px 10px"><div class="w-h" style="padding:0 0 6px"><h3>Progression</h3><span class="sub">${esc(monthName(month))} · ${fmt(t.unites?.[month]||0)} u${dn.length?` · ${fmt(branchU(t,month))} u avec son équipe`:""}</span></div>${personChart(t)}<div class="legend"><span><i class="sw" style="background:var(--brand)"></i>Ses unités</span>${dn.length?`<span><i class="sw" style="background:var(--accent)"></i>Son équipe (${dn.length})</span>`:""}</div></div>
  <div class="note"><span><b>Compte connecté.</b> Ses unités remontent automatiquement de son propre CRM. Ses contacts restent privés.</span></div>
  <div class="two"><div class="field"><span class="lab">Statut</span><span class="badge" style="${jv(t.statut)};align-self:flex-start">${esc(t.statut)}</span></div><div class="field"><span class="lab">Son manager</span><span>${esc(mg?mg.nom:"—")}</span></div></div>
  ${a.rejoint?`<div class="field"><span class="lab">Arrivé(e) le</span><span>${dmy(a.rejoint)}</span></div>`:""}`,`<button class="btn" type="button" data-close>Fermer</button>`,{kind:"ann"})}
function syncAnn(){if(!db||!SELF||!canWrite||!loaded)return;if(MODE==="member"&&!ME)return;clearTimeout(annT);
  annT=setTimeout(()=>{const cur=ym(today()),um=unitMap(P),units={};for(let i=11;i>=0;i--){const m=shiftMonth(cur,-i);if(um[m])units[m]=trunc3(um[m])}
    const d={nom:MODE==="member"?(ME?.nom||""):"Damien Paulot",statut:myStatut(),manager:MODE==="member"?(ME?.manager||""):"",units,objectif:objOf(cur)||null,rejoint:MODE==="member"?(ME?.rejoint||""):""};
    const k=JSON.stringify(d);if(k===annLast)return;annLast=k;db.doc("annuaire/"+SELF).set({...d,maj:today()}).catch(()=>{annLast=""})},1200)}
function showPortal(mode){PORTAL=mode;$("portal").hidden=false;document.body.classList.add("portal-on");paintPortal()}
function hidePortal(){PORTAL=null;$("portal").hidden=true;document.body.classList.remove("portal-on")}
function paintPortal(){const el=$("portal");if(!el||el.hidden)return;
  const keep={};el.querySelectorAll("input,select").forEach(i=>{keep[i.id]=i.value});
  const logo=document.querySelector(".logo img.logo-l")?.getAttribute("src")||"";
  let body="";
  if(PORTAL==="noaccess")body=`<p class="p-sub">Ce logiciel est réservé aux équipes du cabinet.</p><div class="p-box"><b>Pour obtenir ton accès</b><ol><li>Demande à Damien de t'inviter.</li><li>Tu reçois une invitation sur ton adresse e-mail, avec l'accès Éditeur.</li><li>Ouvre le lien de l'e-mail en étant connecté avec cette même adresse.</li></ol></div>`;
  else if(PORTAL==="blocked")body=`<p class="p-sub">Ton accès au logiciel est suspendu.</p><div class="p-box">Contacte Damien pour le réactiver.</div>`;
  else body=`<p class="p-sub">Crée ton espace. Ton CRM reste privé : tes unités officielles viennent de l’ASL du cabinet.</p>
    <form id="pForm" novalidate>
    ${window.WEBKEY&&SP(window.WEBKEY)?`<input type="hidden" id="pWho" value="${esc(window.WEBKEY)}"><div class="p-box" style="margin-bottom:4px">Tu es invité(e) en tant que <b>${esc(SP(window.WEBKEY).nom)}</b> · ${esc(SP(window.WEBKEY).statut||"")}</div>`:`<div class="field"><label for="pWho">Qui es-tu dans la structure ?</label><select id="pWho"><option value="">Choisis ton nom</option>${STRUCT.filter(x=>!x.uid).sort((a,b)=>String(a.nom).localeCompare(String(b.nom),"fr")).map(x=>`<option value="${esc(x.id)}">${esc(x.nom)} · ${esc(x.statut||"")}</option>`).join("")}<option value="__new">Je ne suis pas dans la liste</option></select><small class="p-hint">La liste vient de l'ASL du cabinet. Si ton nom n'y est pas, choisis « Je ne suis pas dans la liste » : Damien reliera ton compte.</small></div>`}
    <div class="field"><label for="pNom">Ton prénom et ton nom</label><input id="pNom" autocomplete="name" placeholder="Prénom Nom"></div>
    <div class="field"><label for="pObj">Objectif mensuel (unités)</label><input id="pObj" type="number" min="0" step="50" inputmode="numeric" placeholder="ex. 500"></div>
    <p class="err" id="pErr"></p><button class="btn p-go" id="pGo" type="submit">Créer mon espace</button></form>`;
  el.innerHTML=`<div class="p-card">${logo?`<img class="p-logo" src="${logo}" alt="Meridia">`:""}<h1>Portail Meridia</h1>${body}</div>`;
  Object.entries(keep).forEach(([id,v])=>{const i=$(id);if(i&&v!==undefined&&v!=="")i.value=v});const w=$("pWho"),n=$("pNom");if(w&&w.type==="hidden"&&n&&!n.value){const sp=SP(w.value);if(sp)n.value=sp.nom}}
$("portal").addEventListener("submit",async e=>{e.preventDefault();if(!db)return;const nom=$("pNom").value.trim();if(!nom){$("pErr").textContent="Indique ton prénom et ton nom.";$("pNom").focus();return}
  const who=$("pWho").value;if(!who){$("pErr").textContent="Choisis ton nom dans la liste, ou « Je ne suis pas dans la liste ».";$("pWho").focus();return}
  const sp=who==="__new"?null:SP(who);
  const o=$("pObj").value.trim(),d={nom,statut:sp?.statut||"JFA1",monStatut:sp?.statut||"JFA1",manager:"",key:sp?.id||null,objectifMensuel:o===""?0:Math.max(0,Number(o)||0),objectifs:{},rejoint:today()};
  try{$("pGo").disabled=true;if(sp){await db.doc("liens/"+UID).set({key:sp.id});if(!window.WEB){const {id:_i,...rest}=sp;await db.doc("structure/"+sp.id).set({...rest,uid:UID})}}await db.doc(CFGDOC).set(d);hidePortal();toast(`Bienvenue ${firstName(nom)}`)}catch(err){$("pErr").textContent=msg(err);$("pGo").disabled=false}});
setTimeout(()=>{const w=$("pWho"),n=$("pNom");if(w&&w.type==="hidden"&&n&&!n.value){const sp=SP(w.value);if(sp)n.value=sp.nom}},0);
$("portal").addEventListener("change",e=>{if(e.target.id==="pWho"){const sp=SP(e.target.value);if(sp&&$("pNom")&&!$("pNom").value)$("pNom").value=sp.nom}});


setView(view);
(async()=>{
  const timer=setTimeout(()=>{$("foot").textContent="Les données mettent du temps à arriver… vérifie ta connexion."},10000);
  if(window.claude)window.claude.use("sample").then(sf=>{sampleFn=sf||false;if(!AH.length)renderAsst()}).catch(()=>{sampleFn=false});
  db=window.claude?await window.claude.use("db"):null;
  if(!db){clearTimeout(timer);loaded=true;$("foot").textContent="Ouvre cette page connecté à ton compte pour voir tes données.";render();return}
  const clean=d=>({id:d.id,...d.data()});
  let u=null;try{u=await window.claude.use("user")}catch(e){}
  let owner=true;if(u){try{owner=await u.isOwner()}catch(e){}}
  if(!owner){MODE="member";UID=await u.id().catch(()=>null);const ed=await u.canEdit().catch(()=>false);buildNav();
    if(!UID||!ed){clearTimeout(timer);loaded=true;canWrite=false;$("fab").hidden=true;$("addTop").hidden=true;$("foot").textContent="";setView(view);showPortal("noaccess");return}
    SELF=UID;PROS="membres/"+UID+"/prospects";CFGDOC="membres/"+UID;TCOL="membres/"+UID+"/equipe";CFG={objectifMensuel:0,objectifs:{},inclureEquipe:false};setView(view);
    db.doc(CFGDOC).onSnapshot(s=>{if(s.exists){CFGRAW=s.data();ME=CFGRAW;CFG={...CFG,...CFGRAW,inclureEquipe:false};if(ACC[UID]?.bloque||meS()?.bloque)showPortal("blocked");else if(PORTAL==="join")hidePortal();deriveStruct();refreshNav();deriveTeam();render()}else{CFGRAW={};showPortal("join")}},()=>{});
    db.collection(TCOL).onSnapshot(s=>{TRAW=s.docs.map(clean);deriveTeam();render()},()=>{});
  }else{
    if(u)SELF=await u.id().catch(()=>null);
    try{const c=u?await u.can("data.write"):null;if(c===false){canWrite=false;$("fab").hidden=true;$("addTop").hidden=true}}catch(e){}
    db.collection("equipe").onSnapshot(s=>{TRAW=s.docs.map(clean);deriveTeam();render()},()=>{});
    db.doc(CFGDOC).onSnapshot(s=>{if(s.exists){CFGRAW=s.data();CFG={...CFG,...CFGRAW}}render()},()=>{});
    db.collection("membres").onSnapshot(s=>{M=s.docs.map(clean);const ids=new Set(M.map(x=>x.id));
      Object.keys(unsubs).forEach(id=>{if(!ids.has(id)){try{unsubs[id]()}catch(e){}delete unsubs[id];delete MP[id]}});
      M.forEach(x=>{if(!unsubs[x.id])unsubs[x.id]=db.collection("membres/"+x.id+"/prospects").onSnapshot(q=>{MP[x.id]=q.docs.map(clean);deriveTeam();render()},()=>{})});
      deriveTeam();render()},()=>{});
  }
  window.claude.use("downloads").then(d=>{dl=d;if(view==="obj")render()}).catch(()=>{});
  if(MODE==="manager")window.claude.use("assets").then(a=>{ASSETS=a}).catch(()=>{});
  db.collection("structure").onSnapshot(s=>{STRUCT=s.docs.map(clean);deriveStruct();
    if(MODE==="manager"&&SELF){const dp=SP("damien-paulot");if(dp&&!dp.uid&&!STRUCT.some(x=>x.uid===SELF)){const {id:_i,...rest}=dp;db.doc("structure/damien-paulot").set({...rest,uid:SELF}).catch(()=>{})}}
    if(MODE==="member"&&UID){if(meS()?.bloque||ACC[UID]?.bloque)showPortal("blocked");else if(PORTAL==="blocked")hidePortal()}
    refreshNav();paintPortal();render()},()=>{});
  db.collection("asl").onSnapshot(s=>{ASLM={};s.docs.forEach(d=>{ASLM[d.id]=d.data()});render()},()=>{});
  db.doc("droits/main").onSnapshot(s=>{DROITS=s.exists?s.data():null;refreshNav();render()},()=>{});
  db.collection("liens").onSnapshot(s=>{LIENS={};s.docs.forEach(d=>{LIENS[d.id]=d.data()});deriveStruct();refreshNav();render()},()=>{});
  db.collection("annuaire").onSnapshot(s=>{ANN=s.docs.map(clean);if(MODE==="member")deriveTeam();paintPortal();render()},()=>{});
  db.collection("acces").onSnapshot(s=>{ACC={};s.docs.forEach(d=>{ACC[d.id]=d.data()});if(MODE==="member"&&UID){if(ACC[UID]?.bloque)showPortal("blocked");else if(PORTAL==="blocked")hidePortal()}render()},()=>{});
  db.doc("bareme/main").onSnapshot(s=>{if(s.exists)BAR={...BAR,...s.data()};render()},()=>{});
  db.collection(PROS).onSnapshot(s=>{if(!s.metadata.fromCache){clearTimeout(timer);$("foot").textContent=""}loaded=true;P=s.docs.map(clean);render()},()=>{clearTimeout(timer);loaded=true;$("foot").textContent="Impossible de charger les contacts.";render()});
})();
</script>
